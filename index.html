<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>问题处置案例库</title>
<style>
:root{
  --bg:#fbf9f0; --card:#fff; --ink:#000; --muted:#7d7d7d; --faint:#9c9c9c;
  --accent:#f2e84e; --accent-d:#cac141; --red:#d9381e; --green:#1e7d4f;
  --line:rgba(0,0,0,.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  max-width:640px; margin:0 auto; min-height:100vh;
  padding:calc(56px + env(safe-area-inset-top)) 15px calc(76px + env(safe-area-inset-bottom));
}
/* ---- 顶栏 ---- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:50;
  background:rgba(251,249,240,.85); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:640px;margin:0 auto;padding:0 15px;height:56px;display:flex;align-items:center;gap:8px}
.topbar h1{font-size:17px;font-weight:650;letter-spacing:-.02em}
.ver{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.topbar .sp{flex:1}
/* ---- 底部 tab（移动端） ---- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:rgba(251,249,240,.9); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{max-width:640px;margin:0 auto;display:flex}
.tabbtn{flex:1;padding:12px 0 10px;text-align:center;font-size:14px;color:var(--muted);cursor:pointer;border:none;background:none;font-family:inherit}
.tabbtn.on{color:var(--ink);font-weight:650}
.tabbtn .dot{width:4px;height:4px;border-radius:2px;background:transparent;margin:4px auto 0}
.tabbtn.on .dot{background:var(--ink)}
/* ---- 右侧导航条（桌面端） ---- */
.rail{display:none}
@media (min-width:1100px){
  body{max-width:760px;padding-right:15px}
  .tabbar{display:none}
  .rail{
    display:flex; flex-direction:column; gap:6px;
    position:fixed; right:28px; top:50%; transform:translateY(-50%); z-index:50;
    background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    border:1px solid var(--line); border-radius:24px; padding:10px 8px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
  }
  .railbtn{
    border:none; background:none; cursor:pointer; font-family:inherit;
    writing-mode:vertical-rl; letter-spacing:.35em;
    font-size:14px; color:var(--muted); padding:14px 10px; border-radius:16px;
  }
  .railbtn.on{background:var(--ink); color:#fff; font-weight:650}
  .railver{writing-mode:vertical-rl;font-size:10px;color:var(--faint);letter-spacing:.2em;padding:6px 10px 2px}
}
/* ---- 通用 ---- */
.pressable{transition:transform .17s ease}
.pressable:active{transform:scale(.98)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fi{animation:rise .3s ease both}
.slabel{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:26px 2px 10px;font-weight:500}
.slabel.neg{color:var(--red);font-weight:650}
.slabel.pos{color:var(--green);font-weight:650}
.card{background:var(--card);border-radius:20px}
.searchwrap{margin:8px 2px 4px}
.search{
  width:100%;border:none;border-bottom:2px solid var(--ink);background:transparent;
  font-size:18px;padding:10px 2px;outline:none;font-family:inherit;
}
.search::placeholder{color:rgba(0,0,0,.2)}
.copybtn{
  background:var(--accent);color:#000;border:none;border-radius:20px;
  padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:background .17s;
}
.copybtn:active{background:var(--accent-d)}
.copybtn.done{background:var(--accent-d)}
.empty{text-align:center;color:var(--faint);font-size:14px;padding:40px 0}
.counts{font-size:12px;color:var(--faint);margin:0 2px 10px}
/* ---- 首页 ---- */
.lifeline{
  display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;
  border-radius:20px;padding:16px;cursor:pointer;
}
.lifeline .ll-t{font-size:15px;font-weight:650;line-height:1.4;flex:1}
.lifeline .ll-s{font-size:12px;color:rgba(255,255,255,.55);margin-top:3px}
.urgbar{display:flex;gap:8px;margin-top:10px}
.urgchip{flex:1;text-align:center;font-size:12px;border-radius:12px;padding:8px 4px;background:var(--card);color:var(--muted);line-height:1.5}
.urgchip b{display:block;font-size:13px}
.urgchip .u-red{color:var(--red)}
.urgchip .u-yellow{color:#9a7b00}
.urgchip .u-green{color:var(--green)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.scard{padding:18px 16px;cursor:pointer;min-height:118px;display:flex;flex-direction:column}
.scard .snum{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.08em}
.scard .stitle{font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.3;margin:6px 0}
.scard .ssub{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:auto}
.scard .scount{font-size:11px;margin-top:8px;color:var(--faint)}
.scard .scount .n{color:var(--red);font-weight:650}
.scard .scount .p{color:var(--green);font-weight:650}
.scard.good{grid-column:1/-1;background:var(--accent);min-height:0}
.scard.good .ssub{color:rgba(0,0,0,.55)}
.scard.good .snum{color:rgba(0,0,0,.4)}
.scard.good .scount,.scard.good .scount .p{color:rgba(0,0,0,.55)}
/* ---- 场景详情 ---- */
.backbtn{border:none;background:none;font-size:14px;color:var(--muted);cursor:pointer;padding:8px 2px;font-family:inherit}
.schead{padding:8px 2px 4px}
.schead .snum{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.08em}
.schead h2{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin:4px 0 6px}
.schead .sub{font-size:14px;color:var(--muted);line-height:1.6}
.lvl{display:inline-block;font-size:12px;font-weight:650;background:var(--red);color:#fff;border-radius:6px;padding:3px 8px;margin-top:10px}
.lvl.calm{background:var(--ink)}
.step{display:flex;gap:14px;padding:16px;margin-bottom:10px;align-items:flex-start}
.stepnum{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;min-width:34px;color:var(--ink)}
.steptx{font-size:15.5px;line-height:1.65;padding-top:3px}
.phase{font-size:13px;font-weight:650;color:var(--muted);margin:18px 2px 8px}
.quote{border-left:3px solid var(--ink);background:var(--card);border-radius:0 16px 16px 0;padding:14px 16px;font-size:15px;line-height:1.7;white-space:pre-wrap}
.redline{border-left:3px solid var(--red);background:var(--card);border-radius:0 16px 16px 0;padding:14px 16px;font-size:14px;line-height:1.7;color:var(--red)}
/* 话术卡 */
.hfcard{padding:16px;margin-bottom:10px}
.hfmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tagchip{font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:3px 9px;color:var(--muted)}
.hftext{font-size:15.5px;line-height:1.75;white-space:pre-wrap}
.hffoot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:10px}
.hfwarn{font-size:12.5px;color:var(--red);line-height:1.6;flex:1}
/* 案例小卡 */
.minicase{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.cid{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);min-width:64px}
.cid.neg{color:var(--red)}
.minicase .ct{font-size:14.5px;font-weight:600;line-height:1.45;flex:1}
.arrow{color:var(--faint);font-size:16px}
/* ---- 案例库 tab ---- */
.warnboard{background:var(--ink);color:#fff;border-radius:20px;padding:18px 16px;margin:6px 0 14px}
.warnboard .wb-t{font-size:15px;font-weight:650;margin-bottom:12px}
.warnboard .wb-i{display:flex;gap:10px;font-size:13px;line-height:1.65;margin-bottom:9px;color:rgba(255,255,255,.88)}
.warnboard .wb-i:last-child{margin-bottom:0}
.warnboard .wb-k{color:var(--accent);font-weight:650;white-space:nowrap}
.bigcats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.bigcat{
  border:2px solid transparent;background:var(--card);border-radius:18px;padding:14px 14px 12px;
  cursor:pointer;text-align:left;font-family:inherit;
}
.bigcat.on{border-color:var(--ink)}
.bigcat .bc-t{font-size:15.5px;font-weight:650;line-height:1.35}
.bigcat .bc-n{font-size:11.5px;color:var(--faint);margin-top:6px}
.bigcat .bc-n .n{color:var(--red);font-weight:650}
.bigcat .bc-n .p{color:var(--green);font-weight:650}
.seg{display:flex;background:rgba(0,0,0,.05);border-radius:20px;padding:3px;margin:6px 2px 12px}
.segbtn{flex:1;border:none;background:none;border-radius:17px;padding:8px 0;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit}
.segbtn.on{background:var(--card);color:var(--ink);font-weight:650}
.casegrid{display:grid;grid-template-columns:1fr;gap:10px}
.casecard{padding:16px;cursor:pointer}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px}
.badge.neg{color:var(--red);background:rgba(217,56,30,.1)}
.badge.pos{color:var(--ink);background:var(--accent)}
.badge.hy{color:var(--muted);background:rgba(0,0,0,.06)}
.badge.cat{color:var(--muted);background:rgba(0,0,0,.05);font-weight:500}
.ctitle{font-size:16.5px;font-weight:650;letter-spacing:-.01em;line-height:1.45}
.cbrief{font-size:13px;color:var(--muted);line-height:1.6;margin-top:8px}
.cdate{font-size:11.5px;color:var(--faint);margin-left:auto}
/* ---- 案例详情浮层 ---- */
.overlay{
  position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;display:none;
  -webkit-overflow-scrolling:touch;
}
.overlay.show{display:block}
.ovin{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 15px calc(40px + env(safe-area-inset-bottom))}
@media (min-width:1100px){ .ovin{max-width:720px} }
.sec{padding:14px 16px;margin-bottom:10px}
.sec h4{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500;margin-bottom:8px}
.sec p{font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.ovtitle{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.35;margin:10px 0 4px}
/* ---- 话术·SOP tab ---- */
.rules{background:var(--card);border-radius:20px;margin:6px 0 12px;overflow:hidden}
.rules-head{padding:15px 16px;display:flex;align-items:center;gap:8px;cursor:pointer}
.rules-head .rt{font-size:14.5px;font-weight:650;flex:1}
.rules-head .chev{color:var(--faint);transition:transform .2s}
.rules.open .rules-head .chev{transform:rotate(90deg)}
.rules-body{display:none;padding:0 16px 16px}
.rules.open .rules-body{display:block}
.rules-body h5{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:10px 0 6px;font-weight:500}
.rules-body .ritem{font-size:13.5px;line-height:1.7;margin-bottom:6px}
.rules-body .ritem.bad{color:var(--red)}
.tagrows{margin:2px 2px 10px}
.tagrow-t{font-size:11.5px;color:var(--faint);margin:8px 2px 6px;letter-spacing:.1em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--card);border-radius:16px;
  padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--muted);font-family:inherit;
}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.sccard{margin-bottom:10px;overflow:hidden}
.schead2{padding:15px 16px;cursor:pointer}
.schead2 .sct{font-size:15.5px;font-weight:650;line-height:1.45}
.schead2 .scg{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.55}
.schead2 .scg b{color:var(--ink)}
.scbody{display:none;padding:0 16px 16px}
.sccard.open .scbody{display:block}
.sccard .chev{color:var(--faint);transition:transform .2s}
.sccard.open .chev{transform:rotate(90deg)}
.udot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:5px;vertical-align:1px}
.udot.red{background:var(--red)}
.udot.yellow{background:#e6b800}
.udot.green{background:var(--green)}
.scquote{font-size:14.5px;line-height:1.8;white-space:pre-wrap;background:rgba(0,0,0,.03);border-radius:14px;padding:13px 14px;margin-top:4px}
.scsop{margin-top:10px}
.scsop li{font-size:13.5px;line-height:1.7;margin:0 0 5px 18px}
.sctaboo{font-size:12.5px;color:var(--red);line-height:1.65;margin-top:10px}
.sopcard{margin-bottom:10px;overflow:hidden}
.sophead{padding:16px;cursor:pointer;display:flex;align-items:center;gap:10px}
.sophead .st{flex:1}
.sophead .sname{font-size:15.5px;font-weight:650;line-height:1.45}
.sophead .strig{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.sopbody{display:none;padding:0 16px 16px}
.sopcard.open .sopbody{display:block}
.sopcard .chev{color:var(--faint);transition:transform .2s}
.sopcard.open .chev{transform:rotate(90deg)}
/* ---- 桌面端多列 ---- */
@media (min-width:720px){
  .sgrid{grid-template-columns:repeat(3,1fr)}
  .scard.good{grid-column:1/-1}
  .bigcats{grid-template-columns:repeat(3,1fr)}
  .casegrid{grid-template-columns:1fr 1fr}
}
</style>
</head>

n④预判上访风险，处置全程留痕。", "SOP-01/06", "HF-03/12", "法务处置实录（内部）"], ["MYJ-F24", "负面", "食安客诉·媒体报道", "广州天河门店银鹭花生牛奶变质客诉及媒体报道处置", "2026-07-18购买/07-24报道", "消费者王先生 × 粤26620门店 × 银鹭厂家 ×《百姓关注》", "7/18消费者在广州天河区门店购买银鹭花生牛奶（生产日期26/4/10，保质期内），次日饮用发现变质结块、味道异常，称身体不适；与门店及厂家沟通均未获满意答复（厂家称'打开后放了一整天'，态度欠佳），消费者遂向《百姓关注》投诉曝光。7/24记者致电总部，客服回应'移交相关部门专人核实，如属实将处罚门店并根据诉求赔偿'；当日下午我司工作人员已与消费者取得联系；7/25-26新浪财经、ZAKER等跟进转述。", "《百姓关注》首发→搜狐/腾讯新闻转载→新浪财经/ZAKER跟进；报道中'门店说可能厂家的问题，让顾客联系厂家'存在不实。", "标准媒体口径＋先行赔付＋当事人协调下架", "①客服对媒体标准回应（承认可能性+给核实路径+给处罚赔偿承诺）；\n②大区指导员当天联系消费者并与门店核实（确认消费者此前未到店反映）；\n③7/25指导员再次致电友好协商；\n④门店先行垫付500元赔偿金，后续按流程向厂家发起质量索赔；\n⑤经沟通，消费者同意主动向相关记者说明情况，并协调记者下架不实报道。", "赔付完成；不实报道协调下架中；跟进报道仅转述客服口径，事件未扩散为热点。", "做对：\n客服对媒体口径堪称模板（不推责、给路径、给承诺）；门店先行垫付再向厂家索赔，把消费者与厂家的矛盾从品牌身上解耦；推动消费者本人向记者澄清，比企业要求撤稿有效得多。\n教训：\n厂家（银鹭）态度恶劣是本次舆情直接起因——供应商客诉协同机制缺失。\n【v1019深化】新增教训：厂商直接对接消费者时立场强硬、对客口径失当，是本次舆情升级的直接推手。已明确机制：质量类客诉统一由美宜佳对客，厂商/供应商不得直接处理消费者沟通。", "①客诉涉厂家责任的，品牌方先行赔付再向厂家索赔，绝不让消费者在'门店-厂家'之间被踢皮球；\n②媒体报道后24小时内专人联系当事人；\n③纠正不实报道最优路径是'当事人主动向记者说明'，而非企业施压；\n④供应商客诉响应纳入采购考核。质量客诉第一原则：统一由美宜佳对客，第一时间对厂商下“禁直接对接消费者”指令并确认回执；消费者已爆料媒体的，24小时内专人联系当事人+先行赔付，再请当事人协调记者。", "SOP-04", "HF-07/08/21", "百姓关注/搜狐"], ["MYJ-F25", "负面", "烟草合规", "无烟证且屡教不改顽固门店处理事件", "见事件经过", "美宜佳", "部分美宜佳加盟门店在未取得烟草专卖零售许可证的情况下持续销售香烟，且经多次警告和整顿后仍不改正。此类顽固门店存在以下特征：无证售烟，通过隐藏式销售规避检查；对公司发出的清退通知、单方面解约函件不予接受；店主情绪激烈，存在上访、暴力抗法等潜在风险；部分门店存在拖欠公司贷款的情况。", "详见事件经过（05原库记载）", "风险矩阵分层处置＋证据留存", "针对顽固门店，公司建立了风险评估矩阵，分两种方向处理。方向一（坚决执行）：针对完全不予配合的门店——立即执行物流停配、POS停止使用；安排片区负责人每日巡查，留存影像证据；书面告知解约依据，留存送达证据；必要时联动当地派出所报备。方向二（缓冲执行）：针对尚有配合意愿的门店——持续执行物流停配、POS停止使用；明确告知取得烟草证后方可恢复销售；每日同步门店管控情况，安抚消费者情绪；提供针对性帮扶引导，协助门店合规整改。通用备案举措：建立门店专项管控台账，每日更新动态；专人对接烟草证办理进度；节假日和315期间重点管控；对帮扶政策的兑现设置前提条件（合规后方可享受）。", "大部分顽固门店在持续施压下最终配合整改或退出；未发生重大上访或暴力冲突事件；部分门店在取得烟草证后恢复合规经营；建立了顽固门店标准化处置流程。", "1.底线思维：无证售烟零容忍是不可触碰的红线，不能因担心冲突而妥协；\n2.风险预判：对店主可能的过激反应（上访、暴力抗法）要提前预判并准备预案；\n3.分层处置：根据门店配合程度采取差异化策略，避免一刀切激化矛盾；\n4.证据留存：所有沟通记录、巡查影像、送达回执都必须完整留存；\n5.情绪管理：安排专人一对一对接，疏导店主情绪，避免事态升级；\n6.帮扶有条件：合规是享受帮扶的前提，不能对违规门店无条件提供帮助。", "一线执行按复盘要点逐条对照；\n关联制度：\n《特许加盟合同》涉烟清退条款；\n《便利店无证销售香烟下架通知书》；\n《关于加盟店违反烟草经营规定解约操作指引》；\n《停业整顿通知书》", "SOP-01/06", "HF-02/11", "05_问题处置案例库（内部）"], ["MYJ-F26", "负面", "近距离开发/选址争议", "近距离开发引发的加盟商投诉事件", "见事件经过", "美宜佳", "美宜佳在快速扩张过程中，部分新开店突破与老店的100米距离限制，引发老店主强烈不满。主要矛盾点：新店距离老店不足100米，截胡客源；老店主认为其商圈利益受到侵害；部分开发团队在签约前未充分告知老店主；部分客户投诉升级到总部上访（2级客诉），甚至引发自媒体曝光（3级客诉）。", "详见事件经过（05原库记载）", "制度建设＋三级客诉分级处理", "1.建店加盟总部制定《开发距离管理制度V1.0》（2026年4月13日生效）；\n2.建立三级客诉处理机制：1级客诉（大区层面沟通安抚）、2级客诉（总部建店加盟总部+客服+法务联合处理）、3级客诉（公共事务部牵引处理）；\n3.明确老店主优先原则：百米内开发新店时，老店主享有优先知情权与优先选择权；\n4.引入补充变更协议（有款/无款）机制；\n5.对受影响老店营业额下滑超10%的，采取改善举措；\n6.建立集中开发看板实时监控新老店数据。", "制度层面建立了规范化的开发距离管控机制；部分客诉通过协商和补贴方式解决；引发上访或舆情的，对相关大区总监启动质询程序；但历史遗留的近距离开店问题仍需长期消化。", "1.规模扩张与门店利益必须兼顾：不能为了扩张速度牺牲老店利益；\n2.开发前必须做好商圈容量评估：确保百米内老店营业额下滑不超过10%；\n3.老店主优先知情权和选择权是底线；\n4.客诉分级处理：不同级别采取不同策略，防止升级；\n5.开发团队的行为规范至关重要：虚假承诺、未充分告知是客诉根源；\n6.事后补救成本高：事前规范远胜于事后补贴。", "一线执行按复盘要点逐条对照；\n关联制度：\n《开发距离管理制度V1.0》；\n《补充变更协议（有款/无款）》；\n《商圈规划确认表》；\n《干部管理条例》（质询与处罚依据）", "SOP-06", "HF-11/12", "05_问题处置案例库（内部）"], ["MYJ-F27", "负面", "商品分货/供应链管理", "分货问题引发的批量客诉事件", "见事件经过", "美宜佳", "美宜佳各门店在商品分货环节频繁出现问题，引发批量客诉。分货问题涉及多种场景：新品补货不及时，门店断货；外购补货流程繁琐，审批周期长；营销活动补货与门店实际需求不匹配；新店首次配货不合理；畅销品补货不足。由于此前各部门无统一客诉处理专员，客诉在各环节来回流转，处理质量参差不齐，部分客诉升级为对品牌的不满。", "详见事件经过（05原库记载）", "首问负责制＋责任到人", "1.客户服务中心发布《美宜佳客户问题处理首问制V1.0》；\n2.建立首问责任制：以职能权属、有利处置原则确定首问部门和协同部门；\n3.明确分货问题归属：新品补货归供应链部长/品类部长；营销活动补货归营销部长；新店首次配货归品类部长；外购/畅销品补货归经营作战部部长；\n4.每大区每业务单元核定1名专属客诉处理人；\n5.建立400客服热线统一受理、分级处理的机制。", "分货类客诉的处理时效明显提升；客诉不再在各环节来回流转；客户满意度有所提升；但供应链端的系统性问题仍需长期优化。", "1.客诉处理必须责任到人：不能多人处理、权责分散；\n2.首问负责制是核心：首问部门牵头办理，不得退回工单；\n3.分类分级处理：不同问题归属不同责任人，避免推诿；\n4.400客服是舆情防火墙：一线客服的专业度直接影响客诉是否升级；\n5.要从客诉中发现系统性问题：分货问题背后是供应链管理能力的不足。", "一线执行按复盘要点逐条对照；\n关联制度：\n《美宜佳客户问题处理首问制V1.0》；\n《美宜佳业务领域流程架构与Owner清单》", "SOP-05", "HF-09/21", "05_问题处置案例库（内部）"], ["MYJ-F28", "负面", "证照合规", "全国门店营业执照排查及无证门店处理事件", "2026年3月", "美宜佳", "2026年3月20日，经过全国门店经营平台显示，有9,684间门店未上传营业执照。经张董召集全国大区总监开会启动排查：3月20-26日完成9,602间有证门店100%上传；排查出82间无营业执照门店；3月26日-5月5日82间门店中完成60间跟进（54间完成办证及上传，6间退出）；仍有22间未闭环：9间办理中，13间暂时无法办证。无法办证原因包括：特殊商圈6间、产权问题2间、铺位暂不符合条件3间、资料不全1间、主体性质问题1间。", "详见事件经过（05原库记载）", "集中攻坚排查＋分类处置", "1.张董亲自召集全国大区总监会议启动排查；\n2.一周集中攻坚完成9,602间有证门店100%上传；\n3.对82间无证门店逐间跟进处理；\n4.与控股法务股权体系沟通，对无法办证门店输出法律风险评估；\n5.对可退出门店协商退出；\n6.对希望保留的门店签署《经营合规确认函》；\n7.制作35门合法合规经营系列微课推送至门店；\n8.建立常态化管理机制：建店加盟平台必须上传营业执照才能执行开业。", "9,602间有证门店完成100%上传；54间无证门店完成办证；6间无证门店退出；13间暂时无法办证的门店需进一步决策；建立了营业执照常态化管理机制。", "1.证照管理是第一道防线：无证经营是重大法律风险；\n2.数字化工具是关键：系统必须设置卡点，无照不能开业；\n3.排查要快速、彻底：一周集中攻坚比长期拖延更有效；\n4.法务前置：对无法办证的门店要提前评估法律风险；\n5.培训要跟上：35门微课是良好的开始，但要确保门店真正学习；\n6.建立自动预警机制：营业执照年检、过期提醒必须系统自动化；\n7.高管重视是推动力：张董亲自召集会议，体现了高层决心。", "一线执行按复盘要点逐条对照；\n关联制度：\n《食品经营许可和备案管理办法》；\n《经营合规确认函（营业执照问题）》；\n\n建店加盟平台开业卡点规则；\n合法合规经营系列微课（35门）", "SOP-02", "HF-02/04", "05_问题处置案例库（内部）"], ["MYJ-F29", "负面", "烟草合规", "全国无证售烟门店大规模排查处置事件", "见事件经过", "美宜佳", "3·15假烟事件后，美宜佳启动全国门店烟草经营合规大排查，发现惊人的数据：全国烟证模版40,700家门店，无证门店4,116家；广东战区核查无证售烟门店1,259家，整体违规占比达60%；AI云点检排查出违规门店1,156家；烟草局核实售假74家；部分门店签署四个零容忍烟草合规专项协议后仍拒绝配合（711家拒绝签署）。", "详见事件经过（05原库记载）", "大排查＋AI云点检＋分类处置", "1.向所有门店发出签署四个零容忍烟草合规专项协议任务（40,047家完成签署，711家拒绝）；\n2.开展全国门店烟草专卖许可证办理全覆盖摸排；\n3.广东战区对无证售烟门店进行专项核查：罚款664家、警告48家、清退50家；\n4.对被投诉涉嫌售卖假烟的门店：烟草局核实售假74家，清退34家，罚款整顿40家；\n5.依托AI云点检、线下每周定点点检、烟草局联合稽核三重方式常态化监管；\n6.建立香烟合规经营常态运营小组。", "大规模排查基本摸清全国无证售烟底数；广东战区违规占比60%的数据令人警醒；606家涉烟重大异常加盟商被解除合作；AI云点检成为常态化监管重要工具；但仍有536家门店暂未完成处置，遗留风险持续。", "1.数据说话：4,116家无证门店的数据说明问题的严重性；\n2.科技赋能：AI云点检是规模化监管的有效手段；\n3.三层防线：AI云点检+线下点检+联合稽核，多重防线互补；\n4.拒绝签署的门店是重大风险：711家拒绝签署协议的门店需重点关注；\n5.常态化机制比运动式排查更重要：不能一阵风，要建立长效机制；\n6.战区差异大：不同战区合规管理水平差异明显，需差异化施策。", "一线执行按复盘要点逐条对照；\n关联制度：\n四个零容忍烟草合规专项协议；\n《便利店烟草制品经营合规常态化处理机制》；\n《香烟合规经营常态运营小组工作规范》；\n广东战区无证售烟违约整改流程", "SOP-01", "HF-01/02", "05_问题处置案例库（内部）"], ["MYJ-F30", "负面", "职业打假·区域专项", "华中、华南职业打假高发区专项防控", "2026年6月起常态", "职业打假人群体 × 高发区域门店", "6月8日商品质量舆情以来，职业打假风险持续：华中、华南为职业打假到店高发区，打假人'抓人（店员违规）/抓商品（过期、假烟）'双线作业，与315假烟、总局约谈议题形成互相借势。", "打假视频在抖音/快手/小红书区域化扩散，单点量级不等，但与热点事件叠加时升档。", "区域布防＋门店免疫力建设＋证据链前置", "①高发区门店清单化管理（被打假到店过的门店建档）；\n②店员'标准话术+三自查'培训下沉到高发区全员；\n③门店每日效期/凭证/价签自检拍照；\n④被打假门店72小时内完成整改回执。", "高发区门店被打假后的处置时效提升；未再出现'查完下午继续卖'类实锤二创。", "做对：\n把打假防控从'事后灭火'转为'区域布防'。\n待强化：\n打假人行为模式库（话术/ 的是政府合规经营宣导会。公司一直严格配合监管要求，会后已第一时间组织自查整改。任何人不得在社交媒体讨论此事，对外问询一律转品牌课。", "禁用“被约谈”“被点名”“出事”等词；禁员工个人发声。", "SOP-02"], ["HF-04", "政府约谈", "政府部门", "会后关系修复拜访", "感谢贵局对我们经营合规的督促指导，这次宣导对我们帮助很大。我们已完成XX家门店的自查整改（附台账），后续希望建立定期沟通机制，有情况我们第一时间向您汇报，也恳请贵局多指导。", "禁提“稿件能不能撤”（首次拜访）；禁空手上门（带整改台账）；禁越过属地直接找上级。", "SOP-02"], ["HF-05", "职业打假", "打假人/拍摄者", "到店拍摄时店员标准应对", "您好，我们门店所有商品均从公司正规渠道进货，索证索票齐全。如果您对商品有疑问，可以拨打我们客服热线400-887-1133，公司会专人跟进。我现在需要正常营业，感谢您的理解。", "禁肢体阻拦、禁抢夺设备、禁争吵对骂、禁私下转账“和解”。", "SOP-03"], ["HF-06", "职业打假", "平台客服/投诉通道", "提交平台投诉时", "该账号发布内容涉嫌不实信息与商誉侵害：我司涉事门店商品进货凭证齐全（附索证索票及进销存记录），视频内容与事实不符，且存在恶意剪辑/诱导性表述，已对我司商誉造成实际损害，请平台依据社区规范予以限流/下架处理。", "禁在投诉中承认未经核实的问题；禁使用威胁性语言。", "SOP-03"], ["HF-07", "食品安全", "投诉顾客", "顾客投诉食安问题首次响应", "非常抱歉给您带来了不好的体验，您的健康最重要。请您先保留好商品和小票，我们马上为您办理退赔；如果身体有任何不适，我们陪同您就医检查。门店已同步下架同批次商品，我们会给您一个明确的处理结果。", "禁质疑顾客（“是不是你自己放坏了”）；禁只退不赔无下文；禁口头承诺“赔钱私了”不留凭证。", "SOP-04"], ["HF-08", "食品安全", "媒体/网友", "食安问题被曝光后的对外口径", "经核实，涉事商品为XX门店个别批次问题，我们已在2小时内完成下架封存，同批次商品已送第三方检测，为顾客办理了退赔。公司食品安全实行全链条管理，后续检测结果与整改情况我们将如实同步。", "禁说“吃出问题是小概率”“别的品牌也有”；禁在检测结果出来前断言“商品没问题”。", "SOP-04"], ["HF-09", "促销客诉", "投诉顾客", "促销规则/缺货/核销争议", "非常抱歉，这次活动给您带来了不便。您反馈的情况我已记录，马上为您核实门店库存/核销情况：如果确实是我们执行的问题，今天内为您补上优惠或等额补偿。感谢您帮我们发现问题。", "禁与消费者争论规则对错；禁说“活动页写了，你自己没看清”。", "SOP-05"], ["HF-10", "促销客诉", "门店店员", "促销期内门店统一口径", "您好，本次活动参与门店和商品以活动页公示为准。您要的这款如果暂时没有，我帮您登记，到货第一时间通知您；或者我帮您查询附近还有货的门店。", "禁随口说“没货了，没办法”；禁私自承诺折扣；禁与顾客争执。", "SOP-05"], ["HF-11", "加盟纠纷", "加盟商", "加盟商投诉/表达不满时首次沟通", "您的经营情况公司非常重视，我已向大区负责人汇报，今天内会有专人和您对接，一起到店里看数据、想办法。您的诉求我逐条记录了，我们一条条来解决。", "禁说“合同写得很清楚”“亏赚是你自己的事”；禁在群里与加盟商争论；禁口头承诺退费/补偿金额。", "SOP-06"], ["HF-12", "加盟纠纷", "媒体/外界", "媒体求证加盟纠纷时", "加盟是公司与合作伙伴共同成长的事业。您了解的情况我们已关注，目前公司正与当事伙伴一对一沟通解决。美宜佳对加盟商有完善的培训、督导与扶持体系，具体个案涉及商务隐私，处理结果我们会与当事方同步。", "禁评论具体加盟商业绩数据；禁指责加盟商“经营不善”；禁泄露合同条款。", "SOP-06"], ["HF-13", "顾客冲突", "当事顾客", "冲突后首次安抚（店主/督导）", "实在对不起，让您今天有这么不好的体验。这件事我们一定负责到底：我已经向我们区域负责人汇报，今天之内给您一个正式答复。您的要求我都记下来了。", "禁当场争对错；禁说“我们店员也不容易”；禁轻易承诺“开除店员”。", "SOP-07"], ["HF-14", "顾客冲突", "坚持要求开除店员的顾客", "谈判期（大区经营负责人出面）", "您反映的问题我们核实了，店员确实存在服务不当。我们的处理是：即日起停岗培训7天，扣罚绩效，并由我亲自带店复查服务质量。如果7天内您再到店仍遇到态度问题，公司将对该店员作辞退处理。这是处理函，请您过目。", "禁直接答应“马上开除”（法律与用工风险）；禁拒绝任何处理（激化）；处理承诺必须书面化、有期限。", "SOP-07"], ["HF-15", "创始人舆情", "内部全员", "创始人/高管被攻击时内部纪律", "近期网络上出现涉及公司创始人的文章。公司要求：全体员工不转发、不评论、不截图外传，统一不回应。对外口径由公共关系中心统一管理，任何媒体求证一律转公共关系中心。", "禁员工以个人名义“护主”下场；禁在群内讨论文章内容细节。", "SOP-08"], ["HF-16", "创始人舆情", "媒体", "媒体求证高管相关报道", "感谢您的关注。公司目前经营一切正常，创始人和管理层专注于企业战略与门店服务。对于网络上的各类评论，我们尊重舆论空间，同时保留对不实信息依法追责的权利。", "禁评价文章作者；禁透露创始人行程与态度；禁说“清者自清”式空话。", "SOP-08"], ["HF-17", "谣言阴谋论", "网友（借友军/自有账号）", "身份类谣言扩散时的事实卡投放", "事实很简单：美宜佳1997年创立于广东东莞，是土生土长的本土企业，创始人张国衡为广东东莞人，公司在东莞纳税、全国4万+门店、带动XX万人就业。不信谣不传谣。", "禁逐条与阴谋论辩论；禁官方号下场“对线”；禁使用“境外势力”等过度定性词。", "SOP-09"], ["HF-18", "谣言阴谋论", "媒体", "媒体求证经营类谣言（倒闭/跑路）", "相关传言完全不实。公司经营稳健：全国在营门店4万+家，2026年上半年新开店XX家，供应链体系正常运转。我们已对造谣账号固定证据，将依法追责。", "禁“无可奉告”；禁只否认不给数据。", "SOP-09"], ["HF-19", "正面传播", "媒体/融媒", "正面活动（公益/周年庆/获奖）邀约通气", "XX老师您好，我们X月X日在XX有一个XX活动（清凉补给站/周年庆），有XX个点位/XX名受助者，现场有XX环节。素材和采访对象我们都准备好了，您这边方便来看看吗？通稿初稿我先发您参考。", "禁要求媒体“必须发”；禁提供与现场不符的数据；公益类禁夹带促销信息。", "SOP-10"], ["HF-20", "正面传播", "店主/员工", "正面活动门店端执行话术", "您好，我们X月X日起有XX活动，您店里的XX就是参与商品/点位。顾客问起就说活动页上这个规则，不清楚的让顾客扫这个码查。欢迎大家拍店里的视频发抖音，带上#XX话题#，公司会抽优质视频给流量支持。", "禁强制店主出镜；禁让店员背复杂口径；禁物料不到位先宣传。", "SOP-10"], ["HF-21", "通用", "任何外部对象", "事实未查清前的唯一对外句", "感谢您的关注，这个情况我们已第一时间启动核实，会在核实清楚后尽快回复您。", "禁任何猜测性表述（“可能是”“应该是”）；禁透露内部处理流程细节。", "SOP-01"], ["HF-22", "通用", "总部升级请示", "一线向总部升级的汇报模板", "【事件】XX，【发现时间】XX，【当前量级】平台XX/阅读XX/互动XX，【R0研判】XX，【已做动作】XX，【需要总部支持】法务/口径/资源XX，【建议】XX。", "禁只抛问题不给研判；禁隐瞒不利信息；禁越过“已做动作”直接要资源。", "SOP-01"], ["HF-23", "恶意索赔/非购买人", "索赔人（非实际购买人）", "有人代他人索赔、或身份存疑时", "您好，赔偿协商我们需要与实际购买者本人进行。如果您是代为反馈，请提供购买者授权，或请本人直接联系我们客服400-887-1133，我们第一时间处理。", "禁向非交易主体赔付；禁在电话中透露门店经营信息；禁承认未经核实的问题。", "SOP-03/04"], ["HF-24", "客诉赔付收口", "投诉顾客", "赔付金额谈妥、准备付款时", "赔偿我们今天就可以安排。麻烦您签一下这份和解确认函（确认收款后双方再无争议），签完马上给您转账；如果您在平台投诉过，到账后也麻烦确认撤诉。", "禁无书面文件付款（无和解函不予核销）；和解函必须含“再无争议+不扩散传播”条款；禁口头私了。", "SOP-04"], ["HF-25", "媒体采访函应对", "媒体（采访函/约稿）", "收到采访函或约稿请求时", "感谢您的关注。您提到的情况我们正在核实/已妥善处理，相关书面材料我们今天内提供给您，后续进展保持同步。", "禁电话即兴作答；禁承诺“能不能不报”；采访函先背景调研再定应对，全程留档。", "SOP-11"], ["HF-26", "记者进线应答", "记者（进线400/门店）", "一线、客服接到记者问询时", "感谢您的反馈。我立即为您转接公司公共关系部门，麻烦您留下联系方式或把采访需求发给我们，会有专人尽快回复您。", "禁私自答复；禁随意承诺；禁评价门店、加盟商或公司内部情况；挂线后当日报战区品牌部。", "SOP-11"], ["HF-27", "加盟诈骗风险提示", "加盟商/意向加盟客户", "冒名诈骗案后的一对一风险提示", "加盟美宜佳请认准五个核验：官方渠道洽谈、费用只进官网公示的对公账户、合同用官方制式文本（带防伪标识）、全程留存证据、警惕“内部名额/特殊渠道”话术。如有疑问请打400-887-1133举报专线。涉案进展以警方结论和法院判决为准。", "禁口头承诺赔偿/退款；禁评论案件细节与受害人信息；禁群发（一对一触达）。", "SOP-13"], ["HF-28", "加盟商客诉沟通禁忌", "加盟商（对抗/威胁曝光时）", "加盟商以曝光、赴总部施压推进诉求时", "您的诉求我逐条记录了，我们今天内安排专人到店里和您当面谈。", "禁“保留起诉权利”等威慑表述（重要意见到场口述、不留文字）；禁签任何“承认违规”的书面说明；禁以个人名义签协议（一律公司名义+法务复核）。", "SOP-06"], ["HF-29", "未成年人事件对家属", "未成年当事人及家属", "涉未成年人事件首次联系家属时", "孩子没事就好，实在抱歉。治疗费用我们先承担，您保留好票据，我们今天内安排专人跟进后续处理，随时向您同步。", "禁争“孩子看着像成年人”；禁拖过24小时不联系；禁在赔偿未谈妥前谈责任划分。", "SOP-14"], ["HF-30", "敲诈特征索赔应对", "内部/执法机关", "对方虚构身份、以删帖/曝光索要钱款时", "（内部口径）对方虚构身份、以删帖或曝光索要钱款，涉嫌敲诈勒索，证据已固定（录音/聊天记录），拟移交公安机关处理，保留追诉权利。", "禁支付任何删帖费/合作费；禁与“媒体”讨价还价；沟通全程录音。", "SOP-03"]], "scs": [["s1_1", "m1", "消费者到店声称买到假烟", "yellow", "🏪门店店长/员工、🧭大区经营部/指导员", ["假烟", "到店", "烟", "真伪", "鉴定"], "【第一步：接待】您好，我是本店店长。我们严格遵守公司对香烟问题零容忍的规定，不卖假烟，遵守烟草局监管。我非常重视您反映的情况，请先到这边坐，我详细了解一下。\n【第二步：核实】麻烦您出示购买凭证和商品，我核实一下是否本店售出。（确认后）这包烟确实是我们门店销售的。关于真伪问题，我没有现场鉴定的资质和能力，烟草真伪的最终认定权在烟草专卖局。我建议两个方案：方案一，我现在陪同您去就近的烟草局做鉴定，同时我会上报给指导员；方案二，如果您不方便现在去，我留下您的联系方式，由专人陪同您去鉴定，或者协助您联系烟草局。无论哪种方式，鉴定结果出来后，我会在72小时内给您明确的答复和处理方案。\n【第三步：封存】为了便于后续鉴定，这包烟我暂时贴上封条（或写明时间的纸条+透明封箱胶），双方签字确认，由您保管或由我们陪同送检。您看可以吗？\n【第四步：登记】我记录一下：您贵姓？联系电话？购买时间？请问您是自己抽的时候觉得口感不对，还是有其他疑虑？", ["接待：引导至非营业区，避免围观，倒水缓和情绪", "核实：核对购买凭证、商品、香烟喷码与烟草证号是否一致，拍照留存", "封存：双方签字封条（或写明时间的纸条+透明封箱胶），拍照留存", "登记：填写《香烟问题登记表》（飞书表单），2小时内上报指导员/大区"], ["你怎么知道是假烟？你是不是故意找茬？", "这肯定不是我们店的烟（未经核实不能断言）", "假一赔十，我现在就赔你（未经鉴定不承诺赔偿）", "你去找烟草局吧，不归我管（不能推诿）"], "稳住现场四步走：接待、核实、封存、登记。真伪认定权在烟草局，我们的态度是：不鉴定、不承诺、不推诿。"], ["s1_2", "m1", "消费者打电话投诉假烟（客服热线）", "yellow", "🎧客服中心", ["假烟", "电话", "热线", "投诉"], "您好，美宜佳客服，工号XXX。您反映的问题我已记录。首先说明：电话端我无法鉴定烟草真伪，最终认定需由烟草专卖局出具鉴定报告。您目前的诉求是【退货/赔偿/举报】，我已记录。我会在24小时内安排购买门店的负责人与您联系，协助您前往烟草局鉴定。您也可以直接携带商品和凭证前往【XX区烟草专卖局，地址：XXX，电话：XXX】。请问您希望在什么时间段接听回访电话？", ["记录必填信息：姓名、电话、购买门店、时间、商品名称/条码、诉求类型、方便回访时间", "工单30分钟响应，24小时内安排门店负责人联系消费者", "第一责任人：经营部长；第二责任人：大区总"], ["在电话里直接判定真假", "擅自承诺赔偿金额"], "电话端不鉴定、只记录、快转办：30分钟响应，24小时门店负责人对接。"], ["s1_3", "m1", "消费者要求“现场假一赔十”", "red", "🏪门店店长/员工、🧭大区经营部/指导员", ["假一赔十", "现场赔偿", "赔十", "激动"], "我理解您的心情。但赔偿的前提是烟草专卖局的鉴定结论。在鉴定结果出具之前，我无法判断责任归属，也不能擅自承诺赔偿金额。赔偿事宜，等鉴定报告出来，我们严格依法依约处理。您看可以吗？", ["如消费者坚持，立即联系指导员/大区中台到场协助", "全程录像/录音", "如情绪激动升级，按红色预警处理", "牢记赔偿标准：购烟金额×10，不足500按500赔付（例：25元假烟→按500元赔付+退款25元=共525元）"], ["未经鉴定，绝不承诺赔偿金额", "门店私下转账高额赔偿", "说“赔多少我说了算”"], "赔偿的前提是鉴定结论。报告没出来之前，一分钱都不能擅自承诺。"], ["s1_4", "m1", "消费者质疑“你们和烟草局是一伙的”", "yellow", "🧭大区经营部/指导员、🗂️大区中台/区域负责人", ["烟草局", "一伙", "公正", "质疑"], "您的顾虑我理解。烟草专卖局是行政执法机构，我们是一般企业，双方是监管与被监管的关系。如果您担心公正性，可以：1. 要求烟草局出具书面鉴定报告，这是有法律效力的文书；2. 同时向12313（烟草监管热线）或12315（消费者热线）反映。我们的立场是：配合调查、依法处理、绝不护短。", ["表明监管与被监管关系", "引导书面鉴定报告+热线双通道", "立场收尾：配合调查、依法处理、绝不护短"], ["急于辩解“我们没关系”", "贬低监管部门公信力"], "监管与被监管，关系说清楚；书面报告加双热线，公正性交给制度。"], ["s1_5", "m1", "消费者/媒体询问门店进货渠道", "green", "🏪门店店长/员工、🎧客服中心、🗂️大区中台/区域负责人", ["进货", "渠道", "烟草证", "配送"], "美宜佳总部不供应香烟。根据国家烟草专卖制度，加盟店必须由加盟商本人向当地烟草专卖局申请办理《烟草专卖零售许可证》，获批后通过当地烟草局统一订货平台（如新商盟）自主进货，由烟草公司直配到店。公司仅提供办证指导和合规培训，不参与烟草采购配送。", ["说明国家烟草专卖制度", "如对方质疑“既然是你们美宜佳的店，就该你们负责”，回应：门店是独立经营实体，持独立营业执照和烟草证，我们对非公司供货商品进行抽检监督，但进货决策权在加盟商。如您发现问题，我们会全力协助调查处理。"], ["暗示总部统一供烟", "把责任推得一干二净"], "烟草进货讲清楚：持证申请、平台订货、烟草直配，公司不参与采购配送。"], ["s1_6", "m1", "消费者询问门店是否有假烟出售", "green", "🏪门店店长/员工、🎧客服中心", ["假烟", "是否有假", "询问"], "国家规定香烟是由烟草局统一配送，我司对售假行为零容忍、严处理。一旦查实门店存在售假问题，我们将立即依规从严处置。感谢您的支持和反馈！", ["表明统一配送+零容忍立场", "感谢反馈，欢迎监督"], ["说“绝对没问题”“从来没出过事”"], "统一配送是制度，零容忍是态度，感谢监督是姿态。"], ["s1_7", "m1", "门店无证售烟", "red", "🧭大区经营部/指导员、🗂️大区中台/区域负责人", ["无证", "售烟", "停业", "违规"], "这属于严重违规经营。美宜佳规定“无证不售烟”。如门店无证销售：1. 公司立即下达《停业整顿通知书》，强制下架烟草商品；2. 上报烟草专卖局（依据《烟草专卖法》第32条，无证经营可处停止经营、没收违法所得、罚款）；3. 对拒不整改的门店，依据加盟合同扣除全部保证金，解除合同清退；4. 如消费者在无证店购烟，可要求退还烟款并主张赔偿。", ["立即停业整顿、强制下架", "上报烟草专卖局", "拒不整改：扣保证金、解约清退", "消费者可退款并主张赔偿"], ["默许“边办证边卖”", "瞒报迟报"], "无证不售烟是铁律：立即停业、上报监管、拒不整改就清退。"], ["s1_8", "m1", "烟草局已确认门店售假，消费者询问赔偿", "red", "🎧客服中心、🗂️大区中台/区域负责人", ["确认售假", "赔偿", "假一赔十"], "烟草局认定的事实我们予以尊重。赔偿处理分两层：门店层面，门店作为直接经营者必须按照承诺承担“假一赔十”（最低500元），如造成健康损害还需承担医疗费、误工费等；公司层面，如门店拒不配合，公司介入处理，先保证消费者赔付，后追究门店相关责任。", ["尊重认定事实", "门店先行承担假一赔十（最低500元）", "门店拒配合→公司介入先赔消费者、后追责门店"], ["质疑烟草局鉴定结论", "让消费者自己和门店扯皮"], "认定事实要尊重，赔付分两层：门店先赔、公司兜底。"], ["s1_9", "m1", "消费者举报售假（含举报奖励）", "yellow", "🎧客服中心、🏪门店店长/员工", ["举报", "奖励", "售假"], "您好，非常感谢您的反馈。我们始终高度重视每一位用户的意见，始终坚持依法合规经营，对任何违规行为秉持零容忍的态度。您提供的信息我们将如实记录，并转交相关负责部门进行核实处理。再次感谢您的监督与支持！\n（问及奖励）非常感谢您对我们品牌和消费者权益的关注！虽然公司暂时没有设立针对个人举报的经济奖励机制，但您的每一次反馈，都是对我们打击假货工作最宝贵的支持。我们会将您提供的信息转交给相关部门跟进，非常谢谢您的正义之举！", ["感谢+记录+转交核实", "奖励问题如实说明暂无机制，强调反馈价值"], ["随口承诺举报奖金", "敷衍记录不转办"], "举报必记录、必转办；暂无奖金，但每一次反馈都是打假最宝贵的支持。"], ["s1_10", "m1", "“四项零容忍”制度解释与安抚（对加盟商）", "yellow", "🧭大区经营部/指导员、🗂️大区中台/区域负责人、🤝加盟商", ["零容忍", "安抚", "加盟商", "协议", "抵触"], "老板您好！今天和您沟通这份烟草经营补充协议/相关烟草经营合规要求，核心目的绝非给您添负担，而是为了给您的生意加上一层“防护盾”。\n烟草生意一直是国家强监管的领域，像无证售烟、从非指定渠道进货、卖假烟这些行为，可不只是普通的经营问题，而是触碰法律红线的严重行为，一旦踩线，不仅会面临监管部门的处罚，还可能给您的生意带来毁灭性打击。\n在这里也给您吃一颗“定心丸”：我们的“零容忍”态度，只针对无证售烟、非指定渠道进货、销售假烟这些性质明确、后果严重的违规行为。如果遇到一些模糊的、需要监管部门界定的情况，我们不会简单“一刀切”，会以烟草部门的调查结论为依据，依法依规处理，保障您的合法权益。\n其实这份协议/这些要求，本质上是给守规矩的您准备的“护身符”。只要您的门店证照齐全、合法经营，没有无证售烟、非指定渠道进货、销售假烟的行为，那么签署这份协议，就是给您的生意上了一道“安全锁”。\n以后经营中遇到拿不准的问题，千万别自己硬扛，随时找我们咨询确认，我们会第一时间给您专业的提醒、清晰的指引和全力的支持！", ["先讲目的：防护盾，不是添负担", "再讲边界：不一刀切，以监管结论为依据", "给承诺：合法经营者的“护身符”“安全锁”", "留通道：拿不准随时找指导员或客服热线"], ["上来就念处罚条款", "把合规要求说成“公司要整你们”"], "零容忍是给守规矩的老板准备的护身符——红线讲得越清楚，生意做得越安心。"], ["s1_11", "m1", "售假门店处罚标准（内外统一口径）", "yellow", "🗂️大区中台/区域负责人、📣总部公关/品牌总部", ["处罚", "解约", "黑名单", "移送司法"], "美宜佳对涉假门店实行“零容忍”政策。一经查实：事实清楚、证据确凿的，立即终止特许经营合同，收回品牌使用权，列入黑名单永久禁入，并配合烟草部门行政处罚；涉及刑事责任的（销售金额5万元以上），移送司法机关处理；监管失职的，区域经营部记过/降职，年度评优一票否决。同时依据《烟草专卖法实施条例》第58条，门店可能面临责令停业、没收违法所得等行政处罚。", ["解约+收回品牌+黑名单永久禁入", "5万以上移送司法", "监管失职同样追责"], ["对外含糊其辞“正在调查”拖延", "护短、淡化处理"], "涉假门店三句话：解约清退进黑名单，五万以上移送司法，监管失职同样追责。"], ["s1_12", "m1", "历史订单无实物索赔", "yellow", "🎧客服中心、🧭大区经营部/指导员", ["历史订单", "无实物", "索赔", "无法鉴定"], "您反映的情况我们非常重视，已第一时间记录并上报核查。公司对烟草经营实行'四项零容忍'，任何违规一经查实立即停业处理。目前我们正在对全国门店开展拉网式排查，核查进展和处理结果会有专人在72小时内向您反馈。请您继续监督。", ["第一时间记录并上报核查", "亮明“四项零容忍”态度：任何违规一经查实立即停业处理", "全国门店拉网式排查，专人在72小时内反馈核查进展和处理结果"], ["无鉴定直接认赔", "直接说“没证据别来找”"], "先记录上报，再亮零容忍态度，72小时内专人反馈——请消费者继续监督。"], ["s1_16", "m1", "门店自清自查（“我没卖假烟但受影响”）", "green", "🧭大区经营部/指导员、🤝加盟商、🏪门店店长/员工", ["自清", "自查", "库存", "喷码", "监控"], "理解您的担忧。请立即执行自清自查：库存核查——今日内清点所有卷烟，核对喷码是否与您的烟草证号一致，不一致立即下架；进货凭证——整理近3个月烟草局订货记录、配送单，备查；监控自查——检查收银台监控是否完好，保存期不少于30天。后续公司将出台专项支持政策，合规经营的加盟商将受到保护。", ["当日清点库存、核对喷码", "整理近3个月订货记录与配送单", "检查监控完好、保存≥30天"], ["口头安慰不落地", "拖延自查"], "自清自查三件事：库存对喷码、凭证留三个月、监控保三十天。"], ["s1_18", "m1", "新加盟商烟草证办理流程（新店专用）", "yellow", "🌱新加盟商、🏪门店店长/员工、🧭大区经营部/指导员", ["烟草证", "办证", "新店", "许可证", "新商盟"], "老板您好！恭喜您加入美宜佳大家庭。烟草证是门店销售香烟的前提条件，非常重要。我给您说一下办理流程：第一步：准备材料——营业执照原件及复印件、法人身份证原件及复印件、经营场所证明（租赁合同或房产证）、门店平面图。第二步：提交申请——到当地烟草专卖局领取《烟草专卖零售许可证申请表》，填写完整后提交，一般15个工作日内审批，部分地区可网上申请，具体咨询当地烟草局。第三步：现场勘查——烟草局工作人员会到门店现场勘查，重点检查经营场所是否与申报一致、是否符合合理布局要求。第四步：领取许可证——审批通过后到烟草局领取《烟草专卖零售许可证》，拿到证后第一时间拍照上传到门店智能经营平台。重要提醒：无证绝对不能上架烟草！无证售烟属于违法行为，公司实行零容忍。烟草证拿到后，必须通过烟草局统一订货平台（如新商盟）进货。香烟喷码必须与烟草证号一致，指导员每月会来检查。如有疑问，随时联系我或拨打烟草局咨询电话。", ["给新加盟商发放《烟草证办理指南》纸质版", "开业前确认烟草证已办理或正在办理中", "未办下烟草证前，门店不得上架任何烟草商品", "指导员每周跟进办理进度"], ["烟草证没办下来就先卖烟（无证售烟违法，立即停业整顿）", "相信“代办烟草证收费”的骗子（办证本身免费）"], "办证四步：备材料、提申请、等勘查、领证上传——无证绝对不能上架烟草！"], ["s2_1", "m2", "消费者投诉“买到过期商品”", "red", "🏪门店店长/员工、🎧客服中心", ["过期", "食品", "退款", "十倍"], "先生/女士，您好！非常抱歉给您带来困扰。针对您反映的情况，我们将立即：1. 下架同批次商品，全门店排查；2. 为您办理全额退款+10倍赔偿（依据《食品安全法》第148条）；3. 安排专人对接您，48小时内给您最终解决方案。请问您方便提供购物小票或支付记录、商品照片、您的联系方式？我们将在2小时内主动联系您。再次深表歉意！", ["立即下架同批次商品，全门店排查", "拍照留存商品、小票", "2小时内主动联系消费者", "48小时内给出最终解决方案", "赔偿依据：《食品安全法》第148条，价款十倍或损失三倍，不足1000元按1000元"], ["“这过期也不是故意的”", "“就过期一天没事”", "“你自己怎么不看清楚”", "隐瞒或擅自丢弃问题商品"], "过期商品零容忍：下架、退款、十倍赔，2小时响应、48小时给方案。"], ["s2_2", "m2", "消费者投诉“商品有异物/异味”", "red", "🏪门店店长/员工、🎧客服中心", ["异物", "异味", "检测", "医疗费"], "先生/女士，您好！我们对此深表歉意。针对您反映的情况，我们将立即：1. 安排专人对接您（1小时内）；2. 先联系食安提供批次报告证明产品合格，安全；【有条件的送回商品送第三方检测】；3. 在证明为我店售卖产品导致的问题后，承担您所有医疗费用（如需就医）；4. 给予您额外补偿（协商确定）。您的反馈对我们非常重要，我们已启动全公司排查，杜绝类似情况。请问您方便提供商品照片/异物照片、购物凭证、您的联系方式？我们将在1小时内主动联系您。再次深表歉意！", ["1小时内确定对接人", "联系食安提供批次报告证明产品合格、安全", "送回的商品送第三方检测", "如证明为门店所售，涉及就医，承担全部 服务", "道歉"], "先生/女士，您好！非常抱歉给您带来不愉快的体验。针对您反映的情况，我们将立即：1. 调取门店监控，核实情况；2. 对涉事员工进行批评教育+再培训；3. 安排店长亲自向您致歉；4. 给予您一份小礼品/优惠券作为补偿。请问您方便提供事发时间、涉事员工特征、您的联系方式？我们将在1小时内主动联系您。再次深表歉意！", ["优先安抚", "判断情绪：情绪大→发起工单；情绪不大→反馈培训", "私发指导员告知投诉情况", "可补券区域登记补券（5元）", "跟进门店后续改善"], ["护短“我们员工不可能这样”", "只道歉不跟进"], "态度投诉五步走：安抚、判情绪、报门店、补小券、盯改善。"], ["s2_9", "m2", "消费者问“加盟商还是总部管理？”", "green", "🏪门店店长/员工、🎧客服中心", ["加盟商", "总部", "管理模式"], "先生/女士，您好！美宜佳采取“总部+加盟商”的双重管理模式。总部负责：食安标准制定、商品统一采购、经营部检查、加盟商管理。加盟商负责：门店日常经营、店员管理、按总部标准执行。我们正在加强加盟商管理：食安积分制（与续约挂钩）、9项自查（每日APP上传）、神秘顾客暗访（每季度1次）、第三方审计（每年1次）。无论总部还是加盟商，我们对消费者负责到底。如有问题，请随时联系我们。", ["讲清双重管理分工", "亮出四项管控动作", "落点：对消费者负责到底"], ["“那是加盟商的事，跟我们没关系”"], "双重管理一句话：总部定标准、加盟抓执行，对消费者负责到底不分家。"], ["s2_15", "m2", "新店首次合规检查要点（新店专用）", "yellow", "🌱新加盟商、🏪门店店长/员工、🧭大区经营部/指导员", ["新店", "合规检查", "首次检查", "整改"], "老板您好！恭喜开业！我是您的指导员XXX，今天来给您做第一次合规检查。这次检查不是来找问题的，而是来帮您把门店经营规范建立起来。检查大概需要1小时，主要查以下几个方面：1. 证照是否齐全（营业执照、烟草证、食品经营许可证）；2. 商品是否合规（无过期、无破损、标签完整）；3. 设备是否正常运行（冷柜、空调、监控）；4. 卫生是否达标；5. 员工是否掌握基本话术。检查过程中我会教您怎么做，您有什么不懂的随时问。\n老板，今天的检查结束了。整体情况[评价]。做得好的：[表扬] 需要改进的：[问题+建议+时限] 我给您一份整改清单，您按上面的要求逐项整改。有什么不明白的随时联系我。下次我[X天后]来复查。加油！", ["开业后30天内完成首次合规检查", "检查五方面：证照、商品、设备、卫生、员工话术", "检查后反馈：表扬+问题+建议+时限，出具整改清单", "约定复查时间"], ["把首次检查当成“找茬”，只挑问题不带教"], "首次检查不是来找问题的，是来帮门店把经营规范建起来的。"], ["s2_16", "m2", "新店员工常见错误及纠正（新店专用）", "yellow", "🌱新加盟商、🏪门店店长/员工、🧭大区经营部/指导员", ["新店", "员工", "错误", "纠正", "培训"], "刚才那个情况，你处理得[评价]。有一个地方需要改进：[描述错误]，正确的做法是[描述正确做法]。来，我们一起练习一下：假设我是消费者，我说[模拟消费者说法]，你应该说[引导练习]。很好！记住这个口诀：[给出口诀]。下次遇到这种情况就这么做。", ["纠正争执：错误“这烟肯定不是假的”→正确“我非常重视您反映的情况，请您详细说一下，我来帮您处理”", "纠正擅自承诺赔偿：错误“我赔你1000块”→正确“您的诉求我记录下来了，会安排专人与您对接，按流程处理”", "纠正不记录不上报：所有投诉必须记录，所有紧急情况必须上报", "纠正把消费者晾一边：先道歉倾听记录（2-3分钟）→告知“我去联系一下专人”→快速上报→回到消费者身边", "开业前必须掌握：保质期位置、冷藏常温区别、鲜食保存与报废时间、烟草喷码位置和含义"], ["“这烟肯定不是假的，你乱说”“你自己看错了”“爱买不买，不买就走”", "“我赔你1000块，你别闹了”“假一赔十，我现在就转给你”", "“算了算了，小事一桩，不用报了”“消费者走了就没事了”"], "新员工四大坑：与消费者争执、擅自承诺赔偿、不记录不上报、把消费者晾一边。"], ["s3_1", "m3", "消费者正常查看商品", "green", "🏪门店店长/员工", ["查看商品", "翻货架", "正常"], "您好，您正常看就行。有发现过期、变质或者包装不对劲的，直接交给店员，我们马上检查、马上处理。", ["正常接待，不阻拦、不贴标签", "做好日检，确保没有问题商品"], ["阻止消费者正常查看商品", "跟防贼一样盯着对方"], "身正不怕影子斜：正常看商品不阻拦，日检做好没把柄。"], ["s3_3", "m3", "消费者指出问题并要求现场赔偿", "yellow", "🏪门店店长/员工", ["现场赔偿", "索赔", "要求赔"], "诉求我记下了。但赔多少得按流程核实，我现在报给大区/指导员，专人跟您对接。留个电话，我催他们尽快回复。", ["不现场承诺金额", "接过商品/凭证现场登记，拍照留存", "核查同批次商品", "立即上报大区"], ["现场私了转账", "和对方讨价还价"], "打假三句话：诉求我记下了、我马上报大区、专人跟您对接。"], ["s3_4", "m3", "要求立即赔付1000元或高额赔偿", "red", "🏪门店店长/员工", ["1000元", "高额", "立即赔付", "打假"], "您的赔偿诉求我们已经记录。赔多少我没办法现场说了算的，得按事实和流程来。我马上报大区，专人跟进，麻烦您等电话/稍等。", ["不承诺具体金额", "要求对方提供证据（商品、小票、照片）", "现场拍照留痕", "立即上报大区，同步发送证据照片", "全程录像/录音，记录对方言行"], ["被激怒后争吵", "怕事私转高额赔偿"], "高额索赔三不：不承诺金额、不跟对方冲突、不私下赔付；三必须：留痕、上报、录像。"], ["s3_5", "m3", "消费者表示要投诉监管部门", "yellow", "🏪门店店长/员工、🎧客服中心", ["投诉", "监管", "市监", "12315"], "您可以依法投诉维权，我们也在同步查。麻烦把商品、小票、照片给我，我们做好记录，处理结果同步您。", ["不阻拦消费者投诉", "同步做好内部留痕", "立即上报大区", "48小时内给出处理方案"], ["阻拦、威胁消费者“你投诉也没用”"], "投诉是他的权利，留痕是我们的底线，48小时给方案是承诺。"], ["s3_6", "m3", "威胁发视频、曝光、找媒体", "red", "🏪门店店长/员工、🎧客服中心", ["曝光", "发视频", "找媒体", "威胁"], "您反馈的问题我们会认真核实并处理，但赔付需要基于事实和公司流程，得按事实走。曝光不能当索赔条件，您给的证据，我马上报大区。", ["全程录像/录音", "立即上报大区，同步报战区/大区品牌-公关岗", "保留所有证据", "48小时内给出处理方案"], ["抢夺手机、阻止拍摄或强行删除视频", "被要挟后当场加码赔偿"], "曝光不能当索赔条件。不威胁、不阻拦，用解决问题争取时间。"], ["s3_8", "m3", "辱骂、威胁员工或拒不离场", "red", "🏪门店店长/员工", ["辱骂", "威胁", "拒不离场", "报警"], "维权可以，骂人不行。再这样影响经营，我们报警。", ["保持冷静，不与对方争吵", "全程录像/录音，开启店内监控", "有证据之后立即报警（110）", "同时上报大区", "保护好自己，不单独对峙，等支援到场"], ["与消费者争吵、推搡、围堵", "单独硬刚"], "维权可以，骂人不行。冷静留痕、报警有据、绝不单独对峙。"], ["s3_9", "m3", "疑似调包、摆拍或恶意制造问题", "red", "🏪门店店长/员工", ["调包", "摆拍", "恶意", "监控"], "这个情况得核实。麻烦您提供商品、小票、过程信息，我同步调监控、查批次。事实没清楚之前，不能现场确认责任和赔付。", ["不现场确认责任", "立即调监控核查", "查商品批次和进货记录", "全程录像/录音", "立即上报大区", "保留所有证据"], ["直接说对方是“职业打假”“碰瓷”“敲诈”", "事实未清就认赔"], "疑似调包三动作：调监控、查批次、留证据——事实没清不认责。"], ["s3_11", "m3", "明确是职业打假人（大区判定后）", "red", "🏪门店店长/员工、🎧客服中心、🗂️大区中台/区域负责人", ["职业打假", "市监局", "施压"], "您好，感谢您的反馈。您反映的问题我们已经记录，我们会按流程核对相关商品的批次和标签信息。请您先保留好商品、外包装和小票，我们核实后会尽快给您回复。\n（对方已举报到市监局施压时）我们尊重您通过正规渠道维权的权利。如果市场监管部门介入调查，我们会积极配合，提供完整的进货记录、库存记录和监控视频等材料。请您耐心等待相关部门的处理结果。", ["按流程核对批次和标签", "请对方保留商品、外包装、小票", "监管介入则积极配合、提供完整材料", "依据2026年4月15日施行的《市场监督管理投诉举报处理办法》：明显超出生活消费需要的投诉可依法界定；夹带、掉包、造假骗赔将移送公安"], ["当面点破“你就是职业打假”", "拒绝配合监管调查"], "职业打假不怕正规渠道：流程照走、材料照给，恶意骗赔自有法律兜底。"], ["s4_1", "m4", "退换货处理", "yellow", "🏪门店店长/员工、🎧客服中心", ["退换货", "退货", "换货"], "（非烟酒未离店）您好，非常抱歉给您带来不便。非烟酒的商品在未离开门店的情况下，我们可以帮您协商退换货。请您提供购物小票，我来帮您处理。\n（烟酒或已离店）非常抱歉给您带来不便，香烟/高档酒是比较特殊的商品，一旦售出是不可以退换货的。如果门店已经和您沟通清楚，这边以门店处理结果为准。", ["先判断商品类型与是否离店", "非烟酒未离店：凭小票协商退换", "烟酒/已离店：解释特殊性，以门店处理结果为准", "优惠券未核销引发：判责任方，门店责任→工单；非门店责任→补券"], ["一口回绝“概不退换”", "烟酒随意退换"], "退换货先分两类：非烟酒未离店协商退，烟酒售出特殊品按门店结果走。"], ["s4_3", "m4", "开发票问题", "green", "🏪门店店长/员工、🎧客服中心", ["发票", "开票", "税号"], "（咨询能否开）您好！根据国家税务管理规定，实体店消费后有权索取发票，您可以直接向购买门店索要发票。如有问题，保留小票或支付记录联系我们，谢谢！\n（门店不愿开）很抱歉给您带来不好的体验，门店未能配合确实给您造成了困扰。麻烦您提供您的开票信息（用户名、税号、邮箱），我们第一时间反馈负责人，协助您完成发票的开具事宜，谢谢！针对该门店不合规的操作，我们也会依据加盟合同进行严肃的整改与通报，杜绝此类事情再次发生。非常感谢您的反馈，正是因为您的监督，才能帮助我们规范加盟商的经营行为。", ["明确消费者有权索票", "门店拒开：收集开票信息、反馈负责人协办", "对门店按合同整改通报"], ["告知“便利店都不开票”"], "发票是法定权利：门店必须开，拒开就整改通报。"], ["s4_4", "m4", "有券无货", "yellow", "🏪门店店长/员工、🎧客服中心", ["优惠券", "无货", "核销"], "您好，非常抱歉给您带来不便。因为优惠券商品过于火爆，优惠活动商品库存有限，因此活动商品都是先到先得。您可以去其它有货门店进行核销（点击优惠券查看参与门店）。\n（意见较大）给您带来不便，这边给您补发一张5元全场券。补发的券是额外补偿给您的，您原有的券还可去其它有货门店核销。非常抱歉给您带来不好的服务体验！", ["解释先到先得+引导查附近有货门店", "意见大→补发5元全场券", "仍不接受→保持解释+补券方案"], ["“没货我也没办法”", "直接收回原券"], "有券无货两板斧：先引去有货门店，再补5元券表歉意。"], ["s4_7", "m4", "商品价格贵", "green", "🏪门店店长/员工、🎧客服中心", ["价格", "贵", "明码标价"], "话术①：您好！美宜佳门店可根据店铺所在商圈、地理位置、人工成本综合评估，对商品进行适当调价，但都是明码标价。\n话术②：您好！此商品不属于国家管控商品，没有指导价，属于市场自由定价。公司也只是根据市场变化给出一个建议零售价，所以门店是可以适当调整价格的。\n话术③：您好！商家根据房租、水电、员工等一系列成本进行定价，享有自主定价权。消费者可根据自身情况进行选择性购买。\n话术④（烟草专用）：您好！按照国烟计〔2017〕72号，只有对天价烟有相关要求，价格单包不超过100元、单条不超过1000元不属于天价烟。一般卷烟的零售价门店可根据店铺所在商圈、地理位置、人工成本综合评估，对商品进行适当调价，但都是明码标价。", ["讲清自主定价+明码标价", "烟草引用国烟计〔2017〕72号天价烟标准"], ["“爱买不买”", "说不清定价依据"], "价格之问四个字：明码标价——商圈定价有依据，选择权利在顾客。"], ["s4_10", "m4", "门店不收现金投诉", "yellow", "🏪门店店长/员工、🎧客服中心", ["现金", "拒收", "支付"], "非常抱歉给您带来了不好的体验，拒收现金是不符合规定的，我们对此高度重视。麻烦您提供对应的门店信息，我们会立即跟进处理。\n（问“是不是公司规定”）请您放心，我们公司一直严格遵守国家法律法规，从未规定门店可以不收现金。根据中国人民银行等部门发布的规定，经营主体不得拒收现金。个别门店出现这种情况，属于员工操作不当，我们会严肃处理并立即整改。", ["定性：拒收现金违规", "发起服务工单", "明确公司从未规定不收现金，严肃处理整改"], ["为门店开脱“找不开零”"], "拒收现金是违规：公司从未这样规定，个别操作严肃处理。"], ["s4_11", "m4", "盗刷问题", "yellow", "🎧客服中心", ["盗刷", "诈骗", "付款码", "报警"], "（付款码截图被盗刷）您好，如果骗子拿着您的微信付款码截图在美宜佳消费，美宜佳是不知道资金来历的，交易过程完全符合微信公司的支付软件规则。这是典型的诈骗案，美宜佳公司建议您报警处理。\n（在美宜佳消费被盗刷）您好，关于您反馈的问题因事件已经涉嫌欺诈犯罪，建议您保留不法分子对您做出的诈骗过程的证据材料并立即到附近的公安或执法机关进行报案处理。我司将全力配合警方或其他有权执法机关对案件勘查作进一步的核实和处理，感谢您的配合，谢谢！\n（政府部门协助办案）警官同志，您好！请将调取证据手续材料发送至pr@myj.com.cn：1. 提供两个警官证的正反面（图片清晰）；2. 介绍信或调取证据通知书；3. 协助调取订单的其他材料。调取结果我们将在一个工作日通过邮件回复。请在邮件正文留下警官联系电话。", ["定性为诈骗案", "引导保留证据、立即报警", "表态全力配合警方", "警方调证：材料发pr@myj.com.cn，一个工作日内邮件回复"], ["承诺门店退赔盗刷金额", "让用户和门店扯皮"], "盗刷是诈骗案：留证据、快报警，我们全力配合警方。"], ["s4_13", "m4", "新开店第一次遇到消费者投诉（新店专用）", "yellow", "🌱新加盟商、🏪门店店长/员工", ["新店", "第一次投诉", "心理疏导", "带教"], "（指导员版）老板，听说店里今天遇到消费者投诉了。您别紧张，这是每个店都会遇到的事，很正常。消费者投诉≠你的店有问题。相反，投诉给了我们改进的机会。您处理得已经不错了。接下来我跟您说一下正确的处理步骤：第一步：稳住自己——不要慌，不要觉得消费者是来“找茬”的，大部分消费者只是想要一个道歉和解决方案。第二步：稳住消费者——第一句话：'非常抱歉给您带来不好的体验'，倒杯水，引导到安静的地方，让消费者把话说完，不要打断。第三步：记录+上报——记录消费者的诉求、商品信息、联系方式，立即联系我（指导员），我帮您判断怎么处理。第四步：跟进——48小时内回访消费者，把处理结果告诉我，我帮您记录归档。记住：不确定的不要擅自承诺，先上报！您做得好的地方：[具体表扬] 下次可以改进的地方：[具体建议] 有问题随时找我！\n（店长版）小李，别紧张。消费者投诉是常有的事，你按照培训时学的话术来处理就行。现在我来带你做一遍：1. 你先过去说：'非常抱歉给您带来不好的体验，我是店长，这件事我来帮您处理'；2. 然后听消费者说完，不要打断；3. 记录他的诉求和联系方式；4. 回来告诉我，我们一起商量解决方案。我在旁边陪着你，不用怕。", ["第一步稳住自己：不慌、不预设对方找茬", "第二步稳住消费者：共情开场+倒水+引导到安静处+听完不打断", "第三步记录+上报：记诉求/商品信息/联系方式，立即联系指导员", "第四步跟进：48小时内回访，结果报指导员归档"], ["不确定就擅自承诺（必须先上报）"], "投诉≠店有问题。先稳住自己，再稳住消费者，记录上报、48小时跟进。"], ["s5_1", "m5", "媒体记者到店采访", "red", "🏪门店店长/员工、🧭大区经营部/指导员、📣总部公关/品牌总部", ["记者", "媒体", "采访", "到店"], "您好！欢迎到访。我是本店店长XXX。请问您是哪家媒体？怎么称呼？\n感谢您关注美宜佳。您关心什么具体问题？我可以为您介绍门店的基本情况。\n您提的这个问题比较重要，我需要上报公司，由专门负责媒体对接的同事来回应您。请您稍等，我马上联系。\n我已经上报公司了，公共关系中心的同事会在1小时内主动联系您。您方便留个名片和电话吗？", ["第一步礼貌接待：引导至安静区域，倒水，不躲不拒", "第二步记录需求：记媒体名称、记者姓名、联系方式、采访主题，请对方出示记者证/工作证并拍照留底", "第三步立即上报：大区→总部公共关系中心，不擅自表态、不擅自接受采访", "第四步专人对接：请记者留联系方式，公共关系中心1小时内联系"], ["躲避、关门、拒绝接待", "擅自接受采访表态", "说“绝对没问题”“全部整改完毕”", "随意透露总部未公开的政策数据", "与记者争执"], "记者到店四步法：礼貌接待、记录需求、立即上报、专人对接。不躲、不推、不擅自表态。"], ["s5_3", "m5", "媒体询问“售假门店怎么处理”", "red", "📣总部公关/品牌总部、🗂️大区中台/区域负责人", ["媒体", "售假", "处理", "三立即"], "美宜佳对售假行为采取“三立即一配合”原则：立即停牌——发现当日即暂停涉事门店烟草销售权限；立即解约——证据确凿的，3日内解除特许经营合同，门店终身不得再次加盟；立即公告——通过官方渠道公示处理结果，接受社会监督；配合执法——全力配合烟草、市场监管部门调查，提供门店进货记录、监控录像等证据，绝不护短。同时，我们在广东省内启动为期一个月的“雷霆行动”，对所有门店卷烟来源进行突击检查，发现外渠道进货的一律清退。", ["三立即：停牌、解约、公告", "一配合：配合执法、绝不护短"], ["“正在调查，无可奉告”", "为涉事门店开脱"], "售假门店处置口径：三立即一配合——停牌、解约、公告，配合执法不护短。"], ["s5_5", "m5", "媒体质疑“是不是你们放纵售假”", "red", "📣总部公关/品牌总部", ["放纵", "售假", "质疑", "道歉"], "品牌始终严格要求所有加盟门店合法合规经营，严禁销售假货，对违规行为一直坚持零容忍、严处理。加盟店在经营过程中出现问题，监管责任不可推卸，对此我们深表歉意。我们不会回避问题，也绝不纵容任何违规行为。感谢您的提醒与监督。", ["亮明零容忍立场", "监管责任不推卸、诚恳致歉", "不回避、不纵容，感谢监督"], ["“这是加盟商个人行为，与总部无关”", "对抗式反问记者"], "放纵之问这样接：零容忍是立场，监管责不推卸，歉意真诚、监督欢迎。"], ["s5_8", "m5", "博主到店取证/拍摄", "red", "🏪门店店长/员工", ["博主", "拍摄", "取证", "直播"], "您好，欢迎到店。请问您是？（记录信息）您如果需要在店内拍摄，请理解我们是正常经营场所。您关心的问题我已经记录下来了，公司有专门负责对接的同事，我会在30分钟内上报，由专人和您联系。这是我的联系方式，也请您留一个联系方式给我。", ["不阻拦公共区域正常拍摄", "不抢夺手机/设备", "全程礼貌，记录对方账号信息、拍摄内容", "立即上报大区→总部公共关系中心", "后续有不实内容，统一走举报流程"], ["抢手机、强行删视频", "围堵博主"], "博主拍摄不硬拦：记录信息、30分钟上报，不实内容走举报流程。"], ["s5_10", "m5", "监管部门调研、约谈", "red", "🗂️大区中台/区域负责人、📣总部公关/品牌总部", ["监管", "约谈", "调研", "检查"], "感谢监管部门的指导和监督。我们高度重视，已成立专项工作组，配合各项检查。具体情况我们已准备了书面材料，会在审核完善后尽快提交。现场我们会认真记录各位的要求，逐项落实。", ["态度积极配合、不回避", "统一口径，心里有数", "不把报告主动交给当局：现场记录要求，会后优化报告、总部审核后再发", "全程留痕：记录调研人员信息、要求、时间节点"], ["不配合、不提供材料", "擅自承诺整改内容", "与检查人员争执", "瞒报、迟报"], "监管约谈四要点：积极配合、统一口径、材料审核后再交、全程留痕。"], ["s5_11", "m5", "群体性事件/集体索赔", "red", "📣总部公关/品牌总部、🗂️大区中台/区域负责人、🏪门店店长/员工", ["群体", "聚集", "集体索赔", "兜底"], "各位，我是本店店长。我理解大家的心情。我已经把情况上报公司了，公司会派专人来处理。请大家推选1-2位代表，我们坐下来沟通。我保证会把大家的诉求如实上报，48小时内给大家答复。\n（对外口径）凡是经核实确实购买到假冒产品的消费者，我们督促涉事门店按“退一赔十”依法承担责任，公司专门设立消费者保障专项基金，主动兜底、优先保障消费者合理诉求。同时郑重说明：对正常维权的消费者负责到底；对恶意索赔、敲诈勒索、虚构事实、借机滋事的行为，绝不姑息，一经查实立即报警处理。", ["稳住现场：请推选1-2位代表坐下谈", "如实上报，承诺48小时答复", "对外口径：真受害必兜底，恶意索赔必追责"], ["和人群逐个争辩", "被围观裹挟当场承诺超额赔偿"], "群体事件两句话：正常维权公司兜底，恶意索赔绝不姑息。"], ["s5_12", "m5", "新店开业期间的舆情防控（新店专用）", "yellow", "🌱新加盟商、🏪门店店长/员工、🧭大区经营部/指导员、📣总部公关/品牌总部", ["新店", "开业", "舆情", "负面评价", "差评"], "（线上负面评价）您好！感谢您对我们新店的关注和反馈。我们刚开业，还在磨合期，如有服务不周的地方深表歉意。您反映的问题我们已经记录，会立即改进。新店开业期间如有任何问题，欢迎您直接到店或拨打400热线反馈，我们一定认真对待。再次感谢您的监督和支持！\n（线下消费者投诉）非常抱歉给您带来不好的体验！我们店刚开业，员工还在培训中，服务不周的地方请您多包涵。您反映的问题我已经详细记录，我会立即上报公司，安排专人在24小时内给您回复和处理方案。作为补偿，我送您一张[优惠券/小礼品]，希望您能给我们一次改正的机会。谢谢您！", ["开业前7天：指导员到店全面检查，确认证照齐全有效", "开业前3天：指导员复查，确认商品上架无误、鲜食保存达标，完成员工话术培训、测试设备", "开业当天：指导员到店支持至少半天，大区品牌-公关岗关注门店附近舆情，电话畅通", "开业后30天：指导员每周到店1次，重点关注消费者投诉，及时处理、上报、反馈", "线上回复后立即截图上报指导员；指导员核实，必要时到店；恶意差评按平台规则申诉"], ["烟草证未办下就上架烟草（风险等级：极高）", "鲜食保存条件不达标", "和给差评的顾客线上对吵"], "开业前后30天：指导员每周到店，负面评价诚恳当天回，回复后立即截图上报。"], ["s6_1", "m6", "门店投诉分货商品量太多", "green", "🎧客服中心、🏪门店店长/员工、🧭大区经营部/指导员、🤝加盟商", ["分货", "压货", "量太多", "销售"], "您好！非常抱歉给您带来的不便。经过大多数门店的数据验证，提高商品覆盖率是可以有效提升门店的销售业绩的。您可以先尝试销售，如果销量确实不好，可以联系大区指导员尝试协助处理。\n（仍不满）您好，感谢您的反馈。我们非常理解，分货不合理会直接影响到门店的销售和利润，这确实需要重视。我可以将您这边近期的销售情况和分货清单生成工单，向大区提出改善建议及具体解决措施。\n（生成工单后）您好，您的问题已经为您生成工单，后续您可留意工单回复结果，谢谢！", ["先引导销售：覆盖率提升业绩有数据支撑", "卖不动→联系指导员协助", "仍不满→销售情况+分货清单生成工单报大区"], ["“公司分的货必须卖完”", "不登记不反馈"], "分货之诉两步走：先拿数据引导试销，卖不动就工单报大区。"], ["s6_3", "m6", "违约金收取", "yellow", "🎧客服中心、🏪门店店长/员工、🧭大区经营部/指导员、🤝加盟商", ["违约金", "罚款", "违规", "合同"], "您好，非常抱歉给您带来困扰。经核实，您是因为【具体XXX违规行为】被收取违约金。根据《特许加盟合同》规定，此行为确实违反经营管理条例。严格执行标准是为了保障每一位门店的长期利益，维护我们共同的品牌声誉。如果您还有疑问，可以随时联系您的指导员详细了解。\n另外也想跟您说明，严格执行标准并不是为了处罚，而是为了保障每一位门店的长期利益，维护我们共同的品牌声誉和顾客信任。商品质量与服务品质是行业底线，也是您门店持续盈利的基础。", ["讲清具体违规事实与合同依据", "附加说明：处罚是保障长期利益", "情绪严重→发起告知工单；有证据证明不合规→发起服务工单"], ["说不清扣款依据", "“公司要罚就罚”的霸道口吻"], "违约金沟通：先摆依据，再讲初心——处罚不是目的，是保障大家长期利益。"], ["s6_5", "m6", "近距离开店", "yellow", "🎧客服中心、🧭大区经营部/指导员、🤝加盟商", ["近距离", "开店", "分流", "100米"], "目前公司是有明确标准的，在同一商圈，新店步行距离老店100米以上，且符合要求，是可以开第二间门店的。\n（担心分流）以我们的开店经验来说，这个距离新开的门店对原有门店的影响是比较小的，且可在一定程度提升老店的品牌影响力。\n（认为不符合流程）我这边会帮您发工单给到对应大区工作人员处理，真的很抱歉给您带来的不便。", ["先讲100米标准", "再讲经验：影响小、还能提升品牌影响力", "认为违规→工单报大区处理"], ["含糊其辞说不清标准", "嘲笑加盟商“想垄断商圈”"], "近距离开店三步答：100米是标准、分流影响有实证、不服流程发工单。"], ["s6_10", "m6", "烟证上传与无证后果", "yellow", "🎧客服中心、🏪门店店长/员工、🤝加盟商", ["烟证", "上传", "证照", "无证", "入机"], "通用上传路径：登录门店智能经营平台→我的→我的档案→证照资料，点击“新增”或“修改”按指引操作即可。拍摄要点：①无反光（需将证件取出拍摄）；②字体清晰；③证件100%入镜。\n（无证卖烟后果）您好！无证经营：监管部门将会没收违法所得，处以违法经营（市场零售价格计算）总额20%以上50%以下的罚款。另外还需要执行停业整顿 const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function splitSteps(txt){
  if(!txt) return [];
  const marks = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  let parts = [], cur = '';
  for(const ch of String(txt)){
    if(marks.includes(ch)){ if(cur.trim()) parts.push(cur.trim()); cur=''; }
    else cur += ch;
  }
  if(cur.trim()) parts.push(cur.trim());
  return parts.map(p => p.replace(/^[；;\s]+|[；;\s]+$/g,''));
}

function copyText(btn, text){
  const done = () => { btn.textContent='已复制'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='复制';btn.classList.remove('done');},1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ btn.textContent='长按复制'; }
    document.body.removeChild(ta);
  }
}

/* ---------- 全局搜索 ---------- */
function doSearch(){
  const q = searchQ.trim();
  const box = document.getElementById('searchRes');
  const home = document.getElementById('homeBody');
  if(!q){ box.innerHTML=''; home.style.display=''; return; }
  home.style.display='none';
  const cs = DATA.cases.filter(c => (c[2]+c[3]+c[6]).includes(q));
  const hs = DATA.hfs.filter(h => (h[1]+h[2]+h[3]+h[4]).includes(q));
  const ss = DATA.sops.filter(s => (s[1]+s[2]).includes(q));
  const scs = DATA.scs.filter(s => (s[2]+s[6]+s[9]+(s[5]||[]).join('')).includes(q));
  let out = `<div class="counts">找到 ${cs.length} 个案例、${scs.length} 条场景话术、${hs.length} 条万能话术、${ss.length} 个 SOP</div>`;
  cs.forEach(c => { out += miniCase(c[0]); });
  scs.forEach(s => { out += scCard(s[0]); });
  hs.forEach(h => { out += `<div class="card minicase pressable" onclick="openHfOverlay('${h[0]}')">
      <span class="cid">${h[0]}</span><span class="ct">${esc(h[3])}｜${esc(String(h[4]).slice(0,28))}…</span><span class="arrow">›</span></div>`; });
  ss.forEach(s => { out += `<div class="card minicase pressable" onclick="openSopOverlay('${s[0]}')">
      <span class="cid">${s[0]}</span><span class="ct">${esc(s[1])}</span><span class="arrow">›</span></div>`; });
  if(!cs.length && !hs.length && !ss.length && !scs.length) out += '<div class="empty">没有找到，换个词试试</div>';
  box.innerHTML = out;
  bindScCards();
}

/* ---------- 场景详情 ---------- */
function miniCase(cid){
  const c = CASE[cid]; if(!c) return '';
  return `<div class="card minicase pressable" onclick="openCase('${cid}')">
    <span class="cid ${c[1]==='负面'?'neg':''}">${esc(cid)}</span>
    <span class="ct">${esc(c[3])}</span><span class="arrow">›</span></div>`;
}

function goScen(bid){
  const b = B[bid];
  let stepsHtml = '', laterHtml = '', quotesHtml = '', redHtml = '', hfHtml = '', scHtml = '';

  b.sops.forEach(sid => {
    const s = SOP[sid];
    splitSteps(s[5]).forEach((t,i) => {
      stepsHtml += `<div class="card step fi"><div class="stepnum">${i+1}</div><div><div class="steptx">${esc(t)}</div></div></div>`;
    });
    const later = splitSteps(s[6]).concat(splitSteps(s[7]));
    later.forEach(t => { laterHtml += `<div class="card step"><div class="stepnum">·</div><div><div class="steptx">${esc(t)}</div></div></div>`; });
    if(s[8]) quotesHtml += `<div class="quote">${esc(s[8])}</div>`;
    if(s[9]) redHtml += `<div class="redline">${esc(s[9])}</div>`;
  });
  b.hfs.forEach((id,i) => { hfHtml += hfCard(id, i); });
  (b.scs||[]).forEach(id => { scHtml += scCard(id); });

  const negCases = b.cases.filter(cid => CASE[cid] && CASE[cid][1]==='负面');
  const posCases = b.cases.filter(cid => CASE[cid] && CASE[cid][1]==='正面');
  let negHtml = '', posHtml = '';
  negCases.forEach(cid => { negHtml += miniCase(cid); });
  posCases.forEach(cid => { posHtml += miniCase(cid); });

  const lvl = b.sops.length ? SOP[b.sops[0]][3] : '';

  $app.innerHTML = `
    <button class="backbtn" onclick="goHome()">‹ 返回</button>
    <div class="schead fi">
      <div class="snum">场景 ${b.num}</div>
      <h2>${esc(b.title)}</h2>
      <div class="sub">${esc(b.sub)}</div>
      ${lvl ? `<span class="lvl ${bid==='good'?'calm':''}">${esc(lvl)}</span>` : ''}
    </div>
    ${stepsHtml ? `<div class="slabel">现在就做（现场第一时间）</div>${stepsHtml}` : ''}
    ${laterHtml ? `<div class="phase">稳住之后：核查与收口</div>${laterHtml}` : ''}
    ${quotesHtml ? `<div class="slabel">对外统一口径</div>${quotesHtml}` : ''}
    ${scHtml ? `<div class="slabel">分情形话术（点开看全文，右下角复制）</div>${scHtml}` : ''}
    ${hfHtml ? `<div class="slabel">照着说（点复制，照着念）</div>${hfHtml}` : ''}
    ${redHtml ? `<div class="slabel">升级红线：出现这些情况立刻上报总部</div>${redHtml}` : ''}
    ${negHtml ? `<div class="slabel neg">🔴 负面警示 · 踩过的坑（${negCases.length}）</div>${negHtml}` : ''}
    ${posHtml ? `<div class="slabel pos">🟢 正面示范 · 做成了的样子（${posCases.length}）</div>${posHtml}` : ''}
    <div style="height:20px"></div>`;
  window.scrollTo(0,0);
  bindCopy();
  bindScCards();
}

function renderCaseList(q){
  let list = DATA.cases;
  let label = '';
  if(caseFilter === 'neg'){ list = list.filter(c=>c[1]==='负面' && !c[0].startsWith('HY')); label='负面警示'; }
  else if(caseFilter === 'pos'){ list = list.filter(c=>c[1]==='正面'); label='正面示范'; }
  else if(caseFilter === 'hy'){ list = list.filter(c=>c[0].startsWith('HY')); label='行业镜鉴'; }
  else if(caseFilter !== 'all'){ list = list.filter(c => caseBucketOf(c[0]) === caseFilter); label = B[caseFilter] ? B[caseFilter].title : ''; }
  if(q) list = list.filter(c => (c[0]+c[2]+c[3]+c[4]+c[6]).includes(q));
  const box = document.getElementById('caseList');
  if(!list.length){ box.innerHTML = '<div class="empty">没有匹配的案例</div>'; return; }
  box.innerHTML = `<div class="counts">${label ? label+' · ' : ''}共 ${list.length} 个案例</div>
    <div class="casegrid">` + list.map((c,i) => {
    const badge = c[1]==='正面' ? '<span class="badge pos">正面</span>'
      : (c[0].startsWith('HY') ? '<span class="badge hy">行业镜鉴</span>' : '<span class="badge neg">负面</span>');
    const bucket = caseBucketOf(c[0]);
    const catTag = bucket && B[bucket] ? `<span class="badge cat">${esc(B[bucket].title)}</span>` : '';
    return `<div class="card casecard pressable fi" style="animation-delay:${Math.min(i*40,240)}ms" onclick="openCase('${c[0]}')">
      <div class="crow"><span class="cid ${c[1]==='负面'?'neg':''}">${esc(c[0])}</span>${badge}${catTag}<span class="cdate">${esc(String(c[4]).slice(0,16))}</span></div>
      <div class="ctitle">${esc(c[3])}</div>
      <div class="cbrief">${esc(String(c[6]).slice(0,64))}…</div>
    </div>`;
  }).join('') + '</div>';
}

function openCase(cid){
  const c = CASE[cid]; if(!c) return;
  const secs = [
    ['时间', c[4]], ['涉事方', c[5]], ['发生了什么', c[6]], ['传播情况', c[7]],
    ['处置策略', c[8]], ['处置动作', c[9]], ['结果', c[10]],

function openSopOverlay(sid){
  const s = SOP[sid]; if(!s) return;

    ${s[3]?`<span class="lvl calm">${esc(s[3])}</span>`:''}</div>

  body += `<div class="slabel">什么时候用</div><div class="card sec"><p>${esc(s[2])}</p></div>`;
  const phases = [['第一时间（现场）', s[5]], ['核查与跟进', s[6]], ['收口与修复', s[7]]];
  phases.forEach(([t,v]) => {
    const steps = splitSteps(v);
    if(!steps.length) return;
    body += `<div class="slabel">${t}</div>` + steps.map((t2,i) =>
      `<div class="card step"><div class="stepnum">${i+1}</div><div><div class="steptx">${esc(t2)}</div></div></div>`).join('');
  });
  if(s[8]) body += `<div class="slabel">对外统一口径</div><div class="quote">${esc(s[8])}</div>`;
  if(s[9]) body += `<div class="slabel">升级红线</div><div class="redline">${esc(s[9])}</div>`;
  openOverlay(body);
}

function openHfOverlay(hid){
  const h = HF[hid]; if(!h) return;
  openOverlay(`<div class="crow"><span class="cid">${esc(h[0])}</span><span class="tagchip">${esc(h[1])}</span><span class="tagchip">${esc(h[2])}</span></div>
    <div class="ovtitle">${esc(h[3])}</div>
    ${hfCard(hid,0)}
    <div style="height:16px"></div>`);
  bindCopy();
}

/* ---------- 话术·SOP tab ---------- */
const HF_GROUPS = [
  ['对顾客、索赔人', ['HF-05','HF-06','HF-07','HF-09','HF-13','HF-14','HF-23','HF-24','HF-29']],
  ['对记者、媒体、网友', ['HF-01','HF-08','HF-12','HF-16','HF-17','HF-18','HF-19','HF-25','HF-26']],
  ['对监管部门', ['HF-02','HF-04']],
  ['对加盟商', ['HF-11','HF-27','HF-28']],
  ['对内部同事', ['HF-03','HF-10','HF-15','HF-20','HF-22','HF-30']],
  ['通用兜底', ['HF-21']],
];

function rulesCard(){
  const P = DATA.principles;
  return `<div class="rules fi" id="rulesCard">
    <div class="rules-head pressable" onclick="document.getElementById('rulesCard').classList.toggle('open')">
      <span class="rt">总则 · 三必说 / 五禁区 / 上报时效</span>
      <span class="chev">›</span>
    </div>
    <div class="rules-body">
      <h5>三必说</h5>
      ${P.mustSay.map(m=>`<div class="ritem"><b>${esc(m.title)}：</b>${esc(m.text)}</div>`).join('')}
      <h5>五禁区（说了就是把柄）</h5>
      ${P.forbidden.map(f=>`<div class="ritem bad">${esc(f)}</div>`).join('')}
      <h5>上报时效</h5>
      ${P.urgency.map(u=>`<div class="ritem">${esc(u.label)}——${esc(u.rule)}</div>`).join('')}
    </div>
  </div>`;
}

function renderKit(){
  $app.innerHTML = `
    ${rulesCard()}
    <div class="searchwrap"><input class="search" id="kitSearch" placeholder="搜话术、搜 SOP，比如：假烟、记者、赔偿"></div>
    <div class="seg">
      <button class="segbtn ${kitSeg==='sc'?'on':''}" data-s="sc">场景话术 ${DATA.scs.length}</button>
      <button class="segbtn ${kitSeg==='hf'?'on':''}" data-s="hf">万能话术 ${DATA.hfs.length}</button>
      <button class="segbtn ${kitSeg==='sop'?'on':''}" data-s="sop">SOP ${DATA.sops.length}</button>
    </div>
    <div id="kitBody"></div>
    <div class="card sec" style="text-align:center;margin-top:18px">
      <p style="font-size:13px;color:var(--muted)">想角色扮演练一遍？去配套的话术训练营（68 场景 + 闯关考核）</p>
      <p style="margin-top:8px"><a href="https://felixm-cvs.github.io/script-cvs/" target="_blank" style="color:var(--ink);font-weight:650;font-size:14px">打开话术训练营 →</a></p>
    </div>`;
  document.querySelectorAll('.segbtn').forEach(b => { b.onclick = () => { kitSeg = b.dataset.s; renderKit(); }; });
  const inp = document.getElementById('kitSearch');
  inp.addEventListener('input', () => renderKitBody(inp.value.trim()));
  renderKitBody('');
}

function renderKitBody(q){
  const box = document.getElementById('kitBody');
  if(kitSeg === 'sc'){
    let modChips = `<button class="chip ${scMod==='all'?'on':''}" data-m="all">全部模块</button>`;
    DATA.modules.forEach(m => {
      const n = DATA.scs.filter(s=>s[1]===m[0]).length;
      if(n) modChips += `<button class="chip ${scMod===m[0]?'on':''}" data-m="${m[0]}">${m[2]} ${esc(m[1])} ${n}</button>`;
    });
    const urgChips = ['all','red','yellow','green'].map(u =>
      `<button class="chip ${scUrg===u?'on':''}" data-u="${u}">${u==='all'?'全部级别':URG_NAME[u]}</button>`).join('');
    let list = DATA.scs;
    if(scMod!=='all') list = list.filter(s=>s[1]===scMod);
    if(scUrg!=='all') list = list.filter(s=>s[3]===scUrg);
    if(q) list = list.filter(s => (s[2]+s[6]+s[9]+(s[5]||[]).join('')+s[4]).includes(q));
    box.innerHTML = `
      <div class="tagrows">
        <div class="tagrow-t">按问题类型</div>
        <div class="chips" id="modChips">${modChips}</div>
        <div class="tagrow-t">按紧急程度</div>
        <div class="chips" id="urgChips">${urgChips}</div>
      </div>
      <div class="counts">共 ${list.length} 条 · 点开看全文，右下角一键复制</div>
      ${list.map(s=>scCard(s[0])).join('') || '<div class="empty">没有匹配的话术</div>'}`;
    document.querySelectorAll('#modChips .chip').forEach(c => {
      c.onclick = () => { scMod = c.dataset.m; renderKitBody(document.getElementById('kitSearch').value.trim()); };
    });
    document.querySelectorAll('#urgChips .chip').forEach(c => {
      c.onclick = () => { scUrg = c.dataset.u; renderKitBody(document.getElementById('kitSearch').value.trim()); };
    });
    bindScCards();
  } else if(kitSeg === 'hf'){
    let out = '';
    HF_GROUPS.forEach(([g, ids]) => {
      let use = ids;
      if(q) use = ids.filter(id => { const h=HF[id]; return h && (h[1]+h[2]+h[3]+h[4]).includes(q); });
      const cards = use.map((id,i) => hfCard(id,i)).join('');
      if(cards) out += `<div class="slabel">${g}</div>${cards}`;
    });
    box.innerHTML = out || '<div class="empty">没有匹配的话术</div>';
    bindCopy();
  } else {
    let list = DATA.sops;
    if(q) list = list.filter(s => (s[0]+s[1]+s[2]+s[5]).includes(q));
    box.innerHTML = (list.map((s,i) => `
      <div class="card sopcard fi" style="animation-delay:${Math.min(i*40,240)}ms" data-sop="${s[0]}">
        <div class="sophead pressable">
          <span class="cid">${s[0]}</span>
          <span class="st"><span class="sname">${esc(s[1])}</span><div class="strig">${esc(s[2])}</div></span>
          <span class="chev">›</span>
        </div>
        <div class="sopbody"></div>
      </div>`).join('')) || '<div class="empty">没有匹配的 SOP</div>';
    document.querySelectorAll('.sopcard').forEach(card => {
      card.querySelector('.sophead').onclick = () => {
        const open = card.classList.toggle('open');
        const body = card.querySelector('.sopbody');
        if(open && !body.innerHTML){
          const s = SOP[card.dataset.sop];
          let h = '';
          if(s[3]) h += `<div class="card sec" style="margin-bottom:10px"><h4>定级</h4><p>${esc(s[3])}　｜　牵头：${esc(s[4])}</p></div>`;
          [['第一时间（现场）',s[5]],['核查与跟进',s[6]],['收口与修复',s[7]]].forEach(([t,v]) => {
            const steps = splitSteps(v);
            if(steps.length) h += `<div class="phase">${t}</div>` + steps.map((t2,i) =>
              `<div class="card step"><div class="stepnum">${i+1}</div><div><div class="steptx">${esc(t2)}</div></div></div>`).join('');
          });
          if(s[8]) h += `<div class="phase">对外统一口径</div><div class="quote">${esc(s[8])}</div>`;
          if(s[9]) h += `<div class="phase">升级红线</div><div class="redline">${esc(s[9])}</div>`;
          if(s[10]) h += `<div class="phase">相关案例</div>` + relatedCases(s[10]);
          body.innerHTML = h;
        }
      };
    });
  }
}
function relatedCases(txt){
  let out = '';
  (txt.match(/(MYJ|HY)-[FZ]\d+/g) || []).forEach(cid => { if(CASE[cid]) out += miniCase(cid); });
  return out;
}

/* ---------- tab 切换（底部 + 右侧导航条同步） ---------- */
function switchTab(t){
  tab = t;
  document.querySelectorAll('.tabbtn').forEach(x => x.classList.toggle('on', x.dataset.tab===t));
  document.querySelectorAll('.railbtn').forEach(x => x.classList.toggle('on', x.dataset.tab===t));
  if(t==='home'){ renderHome(); }
  else if(t==='cases'){ renderCases(); }
  else renderKit();
  window.scrollTo(0,0);
}
document.querySelectorAll('.tabbtn').forEach(b => { b.onclick = () => switchTab(b.dataset.tab); });
document.querySelectorAll('.railbtn').forEach(b => { b.onclick = () => switchTab(b.dataset.tab); });

renderHome();
</script>
</body>
</html>
