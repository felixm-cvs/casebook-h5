<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>问题处置案例库</title>
<style>
:root{
  --bg:#fbf9f0; --card:#fff; --ink:#000; --muted:#7d7d7d; --faint:#9c9c9c;
  --accent:#f2e84e; --accent-d:#cac141; --red:#d9381e; --line:rgba(0,0,0,.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  max-width:640px; margin:0 auto; min-height:100vh;
  padding:calc(56px + env(safe-area-inset-top)) 15px calc(76px + env(safe-area-inset-bottom));
}
/* ---- 顶栏 ---- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:50;
  background:rgba(251,249,240,.85); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:640px;margin:0 auto;padding:0 15px;height:56px;display:flex;align-items:center;gap:8px}
.topbar h1{font-size:17px;font-weight:650;letter-spacing:-.02em}
.ver{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.topbar .sp{flex:1}
/* ---- 底部 tab ---- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:rgba(251,249,240,.9); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{max-width:640px;margin:0 auto;display:flex}
.tabbtn{flex:1;padding:12px 0 10px;text-align:center;font-size:14px;color:var(--muted);cursor:pointer;border:none;background:none}
.tabbtn.on{color:var(--ink);font-weight:650}
.tabbtn .dot{width:4px;height:4px;border-radius:2px;background:transparent;margin:4px auto 0}
.tabbtn.on .dot{background:var(--ink)}
/* ---- 通用 ---- */
.pressable{transition:transform .17s ease}
.pressable:active{transform:scale(.98)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fi{animation:rise .3s ease both}
.slabel{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:26px 2px 10px;font-weight:500}
.card{background:var(--card);border-radius:20px}
/* ---- 首页 ---- */
.searchwrap{margin:8px 2px 4px}
.search{
  width:100%;border:none;border-bottom:2px solid var(--ink);background:transparent;
  font-size:18px;padding:10px 2px;outline:none;font-family:inherit;
}
.search::placeholder{color:rgba(0,0,0,.2)}
.q{font-size:13px;color:var(--muted);margin:14px 2px 12px}
/* 兜底话术条 */
.lifeline{
  display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;
  border-radius:20px;padding:16px;cursor:pointer;
}
.lifeline .ll-t{font-size:15px;font-weight:650;line-height:1.4;flex:1}
.lifeline .ll-s{font-size:12px;color:rgba(255,255,255,.55);margin-top:3px}
.copybtn{
  background:var(--accent);color:#000;border:none;border-radius:20px;
  padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:background .17s;
}
.copybtn:active{background:var(--accent-d)}
.copybtn.done{background:var(--accent-d)}
/* 场景网格 */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.scard{padding:18px 16px;cursor:pointer;min-height:118px;display:flex;flex-direction:column}
.scard .snum{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.08em}
.scard .stitle{font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.3;margin:6px 0}
.scard .ssub{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:auto}
.scard.good{grid-column:1/-1;background:var(--accent);min-height:0}
.scard.good .ssub{color:rgba(0,0,0,.55)}
.scard.good .snum{color:rgba(0,0,0,.4)}
/* ---- 场景详情 ---- */
.backbtn{border:none;background:none;font-size:14px;color:var(--muted);cursor:pointer;padding:8px 2px;font-family:inherit}
.schead{padding:8px 2px 4px}
.schead .snum{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.08em}
.schead h2{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin:4px 0 6px}
.schead .sub{font-size:14px;color:var(--muted);line-height:1.6}
.lvl{display:inline-block;font-size:12px;font-weight:650;background:var(--red);color:#fff;border-radius:6px;padding:3px 8px;margin-top:10px}
.lvl.calm{background:var(--ink)}
/* 步骤流 */
.step{display:flex;gap:14px;padding:16px;margin-bottom:10px;align-items:flex-start}
.stepnum{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;min-width:34px;color:var(--ink)}
.steptx{font-size:15.5px;line-height:1.65;padding-top:3px}
.stepnote{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.phase{font-size:13px;font-weight:650;color:var(--muted);margin:18px 2px 8px}
/* 口径块 */
.quote{border-left:3px solid var(--ink);background:var(--card);border-radius:0 16px 16px 0;padding:14px 16px;font-size:15px;line-height:1.7}
/* 红线块 */
.redline{border-left:3px solid var(--red);background:var(--card);border-radius:0 16px 16px 0;padding:14px 16px;font-size:14px;line-height:1.7;color:var(--red)}
/* 话术卡 */
.hfcard{padding:16px;margin-bottom:10px}
.hfmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tagchip{font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:3px 9px;color:var(--muted)}
.hftext{font-size:15.5px;line-height:1.75}
.hffoot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:10px}
.hfwarn{font-size:12.5px;color:var(--red);line-height:1.6;flex:1}
/* 案例小卡 */
.minicase{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.cid{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);min-width:64px}
.cid.neg{color:var(--red)}
.minicase .ct{font-size:14.5px;font-weight:600;line-height:1.45;flex:1}
.arrow{color:var(--faint);font-size:16px}
/* ---- 案例库 tab ---- */
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto;border:none;border-radius:20px;padding:8px 13px;font-size:13px;cursor:pointer;
  background:rgba(0,0,0,.05);color:var(--ink);font-family:inherit;
}
.pill.on{background:var(--ink);color:#fff;font-weight:600}
.casecard{padding:16px;margin-bottom:10px;cursor:pointer}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px}
.badge.neg{color:var(--red);background:rgba(217,56,30,.1)}
.badge.pos{color:var(--ink);background:var(--accent)}
.badge.hy{color:var(--muted);background:rgba(0,0,0,.06)}
.ctitle{font-size:16.5px;font-weight:650;letter-spacing:-.01em;line-height:1.45}
.cbrief{font-size:13px;color:var(--muted);line-height:1.6;margin-top:8px}
.cdate{font-size:11.5px;color:var(--faint);margin-left:auto}
/* ---- 案例详情浮层 ---- */
.overlay{
  position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;display:none;
  -webkit-overflow-scrolling:touch;
}
.overlay.show{display:block}
.ovin{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 15px calc(40px + env(safe-area-inset-bottom))}
.sec{padding:14px 16px;margin-bottom:10px}
.sec h4{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500;margin-bottom:8px}
.sec p{font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.ovtitle{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.35;margin:10px 0 4px}
/* ---- 锦囊 tab ---- */
.seg{display:flex;background:rgba(0,0,0,.05);border-radius:20px;padding:3px;margin:6px 2px 14px}
.segbtn{flex:1;border:none;background:none;border-radius:17px;padding:8px 0;font-size:13.5px;cursor:pointer;color:var(--muted);font-family:inherit}
.segbtn.on{background:var(--card);color:var(--ink);font-weight:650}
.sopcard{margin-bottom:10px;overflow:hidden}
.sophead{padding:16px;cursor:pointer;display:flex;align-items:center;gap:10px}
.sophead .st{flex:1}
.sophead .sname{font-size:15.5px;font-weight:650;line-height:1.45}
.sophead .strig{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.sopbody{display:none;padding:0 16px 16px}
.sopcard.open .sopbody{display:block}
.chev{color:var(--faint);transition:transform .2s}
.sopcard.open .chev{transform:rotate(90deg)}
.empty{text-align:center;color:var(--faint);font-size:14px;padding:40px 0}
.counts{font-size:12px;color:var(--faint);margin:0 2px 10px}
@media (min-width:520px){
  .scard .stitle{font-size:21px}
}
</style>
</head>

进报道仅转述客服口径，事件未扩散为热点。", "做对：\n客服对媒体口径堪称模板（不推责、给路径、给承诺）；门店先行垫付再向厂家索赔，把消费者与厂家的矛盾从品牌身上解耦；推动消费者本人向记者澄清，比企业要求撤稿有效得多。\n教训：\n厂家（银鹭）态度恶劣是本次舆情直接起因——供应商客诉协同机制缺失。\n【v1019深化】新增教训：厂商直接对接消费者时立场强硬、对客口径失当，是本次舆情升级的直接推手。已明确机制：质量类客诉统一由美宜佳对客，厂商/供应商不得直接处理消费者沟通。", "①客诉涉厂家责任的，品牌方先行赔付再向厂家索赔，绝不让消费者在'门店-厂家'之间被踢皮球；\n②媒体报道后24小时内专人联系当事人；\n③纠正不实报道最优路径是'当事人主动向记者说明'，而非企业施压；\n④供应商客诉响应纳入采购考核。质量客诉第一原则：统一由美宜佳对客，第一时间对厂商下“禁直接对接消费者”指令并确认回执；消费者已爆料媒体的，24小时内专人联系当事人+先行赔付，再请当事人协调记者。", "SOP-04", "HF-07/08/21", "百姓关注/搜狐"], ["MYJ-F25", "负面", "烟草合规", "无烟证且屡教不改顽固门店处理事件", "见事件经过", "美宜佳", "部分美宜佳加盟门店在未取得烟草专卖零售许可证的情况下持续销售香烟，且经多次警告和整顿后仍不改正。此类顽固门店存在以下特征：无证售烟，通过隐藏式销售规避检查；对公司发出的清退通知、单方面解约函件不予接受；店主情绪激烈，存在上访、暴力抗法等潜在风险；部分门店存在拖欠公司贷款的情况。", "详见事件经过（05原库记载）", "风险矩阵分层处置＋证据留存", "针对顽固门店，公司建立了风险评估矩阵，分两种方向处理。方向一（坚决执行）：针对完全不予配合的门店——立即执行物流停配、POS停止使用；安排片区负责人每日巡查，留存影像证据；书面告知解约依据，留存送达证据；必要时联动当地派出所报备。方向二（缓冲执行）：针对尚有配合意愿的门店——持续执行物流停配、POS停止使用；明确告知取得烟草证后方可恢复销售；每日同步门店管控情况，安抚消费者情绪；提供针对性帮扶引导，协助门店合规整改。通用备案举措：建立门店专项管控台账，每日更新动态；专人对接烟草证办理进度；节假日和315期间重点管控；对帮扶政策的兑现设置前提条件（合规后方可享受）。", "大部分顽固门店在持续施压下最终配合整改或退出；未发生重大上访或暴力冲突事件；部分门店在取得烟草证后恢复合规经营；建立了顽固门店标准化处置流程。", "1.底线思维：无证售烟零容忍是不可触碰的红线，不能因担心冲突而妥协；\n2.风险预判：对店主可能的过激反应（上访、暴力抗法）要提前预判并准备预案；\n3.分层处置：根据门店配合程度采取差异化策略，避免一刀切激化矛盾；\n4.证据留存：所有沟通记录、巡查影像、送达回执都必须完整留存；\n5.情绪管理：安排专人一对一对接，疏导店主情绪，避免事态升级；\n6.帮扶有条件：合规是享受帮扶的前提，不能对违规门店无条件提供帮助。", "一线执行按复盘要点逐条对照；\n关联制度：\n《特许加盟合同》涉烟清退条款；\n《便利店无证销售香烟下架通知书》；\n《关于加盟店违反烟草经营规定解约操作指引》；\n《停业整顿通知书》", "SOP-01/06", "HF-02/11", "05_问题处置案例库（内部）"], ["MYJ-F26", "负面", "近距离开发/选址争议", "近距离开发引发的加盟商投诉事件", "见事件经过", "美宜佳", "美宜佳在快速扩张过程中，部分新开店突破与老店的100米距离限制，引发老店主强烈不满。主要矛盾点：新店距离老店不足100米，截胡客源；老店主认为其商圈利益受到侵害；部分开发团队在签约前未充分告知老店主；部分客户投诉升级到总部上访（2级客诉），甚至引发自媒体曝光（3级客诉）。", "详见事件经过（05原库记载）", "制度建设＋三级客诉分级处理", "1.建店加盟总部制定《开发距离管理制度V1.0》（2026年4月13日生效）；\n2.建立三级客诉处理机制：1级客诉（大区层面沟通安抚）、2级客诉（总部建店加盟总部+客服+法务联合处理）、3级客诉（公共事务部牵引处理）；\n3.明确老店主优先原则：百米内开发新店时，老店主享有优先知情权与优先选择权；\n4.引入补充变更协议（有款/无款）机制；\n5.对受影响老店营业额下滑超10%的，采取改善举措；\n6.建立集中开发看板实时监控新老店数据。", "制度层面建立了规范化的开发距离管控机制；部分客诉通过协商和补贴方式解决；引发上访或舆情的，对相关大区总监启动质询程序；但历史遗留的近距离开店问题仍需长期消化。", "1.规模扩张与门店利益必须兼顾：不能为了扩张速度牺牲老店利益；\n2.开发前必须做好商圈容量评估：确保百米内老店营业额下滑不超过10%；\n3.老店主优先知情权和选择权是底线；\n4.客诉分级处理：不同级别采取不同策略，防止升级；\n5.开发团队的行为规范至关重要：虚假承诺、未充分告知是客诉根源；\n6.事后补救成本高：事前规范远胜于事后补贴。", "一线执行按复盘要点逐条对照；\n关联制度：\n《开发距离管理制度V1.0》；\n《补充变更协议（有款/无款）》；\n《商圈规划确认表》；\n《干部管理条例》（质询与处罚依据）", "SOP-06", "HF-11/12", "05_问题处置案例库（内部）"], ["MYJ-F27", "负面", "商品分货/供应链管理", "分货问题引发的批量客诉事件", "见事件经过", "美宜佳", "美宜佳各门店在商品分货环节频繁出现问题，引发批量客诉。分货问题涉及多种场景：新品补货不及时，门店断货；外购补货流程繁琐，审批周期长；营销活动补货与门店实际需求不匹配；新店首次配货不合理；畅销品补货不足。由于此前各部门无统一客诉处理专员，客诉在各环节来回流转，处理质量参差不齐，部分客诉升级为对品牌的不满。", "详见事件经过（05原库记载）", "首问负责制＋责任到人", "1.客户服务中心发布《美宜佳客户问题处理首问制V1.0》；\n2.建立首问责任制：以职能权属、有利处置原则确定首问部门和协同部门；\n3.明确分货问题归属：新品补货归供应链部长/品类部长；营销活动补货归营销部长；新店首次配货归品类部长；外购/畅销品补货归经营作战部部长；\n4.每大区每业务单元核定1名专属客诉处理人；\n5.建立400客服热线统一受理、分级处理的机制。", "分货类客诉的处理时效明显提升；客诉不再在各环节来回流转；客户满意度有所提升；但供应链端的系统性问题仍需长期优化。", "1.客诉处理必须责任到人：不能多人处理、权责分散；\n2.首问负责制是核心：首问部门牵头办理，不得退回工单；\n3.分类分级处理：不同问题归属不同责任人，避免推诿；\n4.400客服是舆情防火墙：一线客服的专业度直接影响客诉是否升级；\n5.要从客诉中发现系统性问题：分货问题背后是供应链管理能力的不足。", "一线执行按复盘要点逐条对照；\n关联制度：\n《美宜佳客户问题处理首问制V1.0》；\n《美宜佳业务领域流程架构与Owner清单》", "SOP-05", "HF-09/21", "05_问题处置案例库（内部）"], ["MYJ-F28", "负面", "证照合规", "全国门店营业执照排查及无证门店处理事件", "2026年3月", "美宜佳", "2026年3月20日，经过全国门店经营平台显示，有9,684间门店未上传营业执照。经张董召集全国大区总监开会启动排查：3月20-26日完成9,602间有证门店100%上传；排查出82间无营业执照门店；3月26日-5月5日82间门店中完成60间跟进（54间完成办证及上传，6间退出）；仍有22间未闭环：9间办理中，13间暂时无法办证。无法办证原因包括：特殊商圈6间、产权问题2间、铺位暂不符合条件3间、资料不全1间、主体性质问题1间。", "详见事件经过（05原库记载）", "集中攻坚排查＋分类处置", "1.张董亲自召集全国大区总监会议启动排查；\n2.一周集中攻坚完成9,602间有证门店100%上传；\n3.对82间无证门店逐间跟进处理；\n4.与控股法务股权体系沟通，对无法办证门店输出法律风险评估；\n5.对可退出门店协商退出；\n6.对希望保留的门店签署《经营合规确认函》；\n7.制作35门合法合规经营系列微课推送至门店；\n8.建立常态化管理机制：建店加盟平台必须上传营业执照才能执行开业。", "9,602间有证门店完成100%上传；54间无证门店完成办证；6间无证门店退出；13间暂时无法办证的门店需进一步决策；建立了营业执照常态化管理机制。", "1.证照管理是第一道防线：无证经营是重大法律风险；\n2.数字化工具是关键：系统必须设置卡点，无照不能开业；\n3.排查要快速、彻底：一周集中攻坚比长期拖延更有效；\n4.法务前置：对无法办证的门店要提前评估法律风险；\n5.培训要跟上：35门微课是良好的开始，但要确保门店真正学习；\n6.建立自动预警机制：营业执照年检、过期提醒必须系统自动化；\n7.高管重视是推动力：张董亲自召集会议，体现了高层决心。", "一线执行按复盘要点逐条对照；\n关联制度：\n《食品经营许可和备案管理办法》；\n《经营合规确认函（营业执照问题）》；\n\n建店加盟平台开业卡点规则；\n合法合规经营系列微课（35门）", "SOP-02", "HF-02/04", "05_问题处置案例库（内部）"], ["MYJ-F29", "负面", "烟草合规", "全国无证售烟门店大规模排查处置事件", "见事件经过", "美宜佳", "3·15假烟事件后，美宜佳启动全国门店烟草经营合规大排查，发现惊人的数据：全国烟证模版40,700家门店，无证门店4,116家；广东战区核查无证售烟门店1,259家，整体违规占比达60%；AI云点检排查出违规门店1,156家；烟草局核实售假74家；部分门店签署四个零容忍烟草合规专项协议后仍拒绝配合（711家拒绝签署）。", "详见事件经过（05原库记载）", "大排查＋AI云点检＋分类处置", "1.向所有门店发出签署四个零容忍烟草合规专项协议任务（40,047家完成签署，711家拒绝）；\n2.开展全国门店烟草专卖许可证办理全覆盖摸排；\n3.广东战区对无证售烟门店进行专项核查：罚款664家、警告48家、清退50家；\n4.对被投诉涉嫌售卖假烟的门店：烟草局核实售假74家，清退34家，罚款整顿40家；\n5.依托AI云点检、线下每周定点点检、烟草局联合稽核三重方式常态化监管；\n6.建立香烟合规经营常态运营小组。", "大规模排查基本摸清全国无证售烟底数；广东战区违规占比60%的数据令人警醒；606家涉烟重大异常加盟商被解除合作；AI云点检成为常态化监管重要工具；但仍有536家门店暂未完成处置，遗留风险持续。", "1.数据说话：4,116家无证门店的数据说明问题的严重性；\n2.科技赋能：AI云点检是规模化监管的有效手段；\n3.三层防线：AI云点检+线下点检+联合稽核，多重防线互补；\n4.拒绝签署的门店是重大风险：711家拒绝签署协议的门店需重点关注；\n5.常态化机制比运动式排查更重要：不能一阵风，要建立长效机制；\n6.战区差异大：不同战区合规管理水平差异明显，需差异化施策。", "一线执行按复盘要点逐条对照；\n关联制度：\n四个零容忍烟草合规专项协议；\n《便利店烟草制品经营合规常态化处理机制》；\n《香烟合规经营常态运营小组工作规范》；\n广东战区无证售烟违约整改流程", "SOP-01", "HF-01/02", "05_问题处置案例库（内部）"], ["MYJ-F30", "负面", "职业打假·区域专项", "华中、华南职业打假高发区专项防控", "2026年6月起常态", "职业打假人群体 × 高发区域门店", "6月8日商品质量舆情以来，职业打假风险持续：华中、华南为职业打假到店高发区，打假人'抓人（店员违规）/抓商品（过期、假烟）'双线作业，与315假烟、总局约谈议题形成互相借势。", "打假视频在抖音/快手/小红书区域化扩散，单点量级不等，但与热点事件叠加时升档。", "区域布防＋门店免疫力建设＋证据链前置", "①高发区门店清单化管理（被打假到店过的门店建档）；\n②店员'标准话术+三自查'培训下沉到高发区全员；\n③门店每日效期/凭证/价签自检拍照；\n④被打假门店72小时内完成整改回执。", "高发区门店被打假后的处置时效提升；未再出现'查完下午继续卖'类实锤二创。", "做对：\n把打假防控从'事后灭火'转为'区域布防'。\n待强化：\n打假人行为模式库（话术/套路/活跃区域）尚未体系化。", "①把'打假到店'列入晨会日报项；\n②每个高发区门店店员必须能背出HF-05标准话术；\n③被打假门店信息24小时内共享给同城市其他门店预警。", "SOP-03", "HF-05/06", "历史专项工作（内部）"], ["MYJ-Z01", "正面", "品牌活动·IP联名", "29周年庆×猪猪侠联名整合传播", "2026-07全月", "美宜佳×猪猪侠IP", "29周年庆绑定猪猪侠IP：贴纸、38cm公仔、抽奖；#美宜佳29周年庆猪猪侠陪你过盛夏#等官方话题全渠道投放；爆款单品（7元雪花金冠/0.01元冰杯12000份/1元精酿）+69代100全国券组合。", "抖音/小红书/视频号/微博/公众号全渠道；#去美宜佳找猪猪侠#自然扩散；贡献本周80%以上正面声量，门店店主自发短视频形成UGC护城河。", "IP借势＋爆品引流＋UGC裂变", "①话题矩阵（官方话题+门店话题+UGC话题）；\n ②抖音官方直播间作为爆品分发核心入口；\n ③1元/0.01元钩子产品制造社交货币；\n ④店主端提供爆款内容模板。", "正面声量稳居第一议题；评论区负面被压制在低位；店主自发账号成为天然传播池。", "做对：\nIP+爆品+UGC三层结构，没把周年庆做成纯促销。\n可优化：\n话题集中度太高，缺乏创始人故事/ESG等长线内容。", "大区复制时“三件套”不可缺：\n 一个可晒的IP物料、一个可抢的钩子爆品、一套店主可直接套用的短视频模 /* 把 SOP 的 ①②③ 文本拆成步骤数组 */
function splitSteps(txt){
  if(!txt) return [];
  const marks = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  let parts = [], cur = '';
  for(const ch of String(txt)){
    if(marks.includes(ch)){ if(cur.trim()) parts.push(cur.trim()); cur=''; }
    else cur += ch;
  }
  if(cur.trim()) parts.push(cur.trim());
  return parts.map(p => p.replace(/^[；;\s]+|[；;\s]+$/g,''));
}

    setTimeout(()=>{btn.textContent='复制';btn.classList.remove('done');},1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ btn.textContent='长按复制'; }
    document.body.removeChild(ta);
  }
}

/* ---------- 话术卡 ---------- */
function hfCard(id, i){
  const h = HF[id]; if(!h) return '';
  return `<div class="card hfcard fi" style="animation-delay:${Math.min(i*50,300)}ms">
    <div class="hfmeta">
      <span class="tagchip">${esc(h[2])}</span>
      <span class="tagchip">${esc(h[3])}</span>
    </div>
    <div class="hftext">${esc(h[4])}</div>
    <div class="hffoot">
      <div class="hfwarn">${h[5] ? '禁忌：'+esc(h[5]) : ''}</div>
      <button class="copybtn pressable" onclick="copyText(this, ${JSON.stringify('')} )" data-hf="${esc(id)}">复制</button>
    </div>
  </div>`;
}

/* ---------- 首页 ---------- */
function renderHome(){
  let cards = '';
  DATA.scenOrder.forEach((bid, i) => {
    const b = B[bid];
    cards += `<div class="card scard pressable fi ${bid==='good'?'good':''}" style="animation-delay:${i*40}ms" onclick="goScen('${bid}')">
      <div class="snum">${b.num}</div>
      <div class="stitle">${esc(b.title)}</div>
      <div class="ssub">${esc(b.sub)}</div>
    </div>`;
  });
  $app.innerHTML = `
    <div class="searchwrap"><input class="search" id="search" placeholder="搜案例、搜话术，比如：过期、记者、索赔" value="${esc(searchQ)}"></div>
    <div id="searchRes"></div>
    <div id="homeBody">
      <div class="lifeline pressable fi" onclick="goLifeline()">

          <div class="ll-t">还没搞清楚状况？只说这一句</div>
          <div class="ll-s">事实未查清前的唯一对外口径，全场景通用</div>
        </div>
        <button class="copybtn" id="lifelineBtn">复制</button>
      </div>

      <div class="card sec fi"><p>1. 现场先点开对应场景，按【现在就做】一步步来；话术页右下角可以一键复制。
2. 任何赔付，先签和解函再付款；任何媒体接触，先报大区品牌课，不私自回应。
3. 拿不准就升级：场景页底部写了升级红线，过了线立刻上报。</p></div>
    </div>`;
  const inp = document.getElementById('search');
  inp.addEventListener('input', () => { searchQ = inp.value; doSearch(); });
  document.getElementById('lifelineBtn').addEventListener('click', e => {
    e.stopPropagation(); copyText(e.target, HF['HF-21'][4]);
  });
  if(searchQ) doSearch();
}

function goLifeline(){ openHfOverlay('HF-21'); }

/* ---------- 搜索 ---------- */
function doSearch(){
  const q = searchQ.trim();
  const box = document.getElementById('searchRes');
  const home = document.getElementById('homeBody');
  if(!q){ box.innerHTML=''; home.style.display=''; return; }
  home.style.display='none';
  const cs = DATA.cases.filter(c => (c[2]+c[3]+c[6]).includes(q));
  const hs = DATA.hfs.filter(h => (h[1]+h[2]+h[3]+h[4]).includes(q));
  const ss = DATA.sops.filter(s => (s[1]+s[2]).includes(q));
  let out = `<div class="counts">找到 ${cs.length} 个案例、${hs.length} 条话术、${ss.length} 个 SOP</div>`;
  cs.forEach(c => { out += miniCase(c[0]); });
  hs.forEach(h => { out += `<div class="card minicase pressable" onclick="openHfOverlay('${h[0]}')">
      <span class="cid">${h[0]}</span><span class="ct">${esc(h[3])}｜${esc(String(h[4]).slice(0,28))}…</span><span class="arrow">›</span></div>`; });
  ss.forEach(s => { out += `<div class="card minicase pressable" onclick="openSopOverlay('${s[0]}')">
      <span class="cid">${s[0]}</span><span class="ct">${esc(s[1])}</span><span class="arrow">›</span></div>`; });
  if(!cs.length && !hs.length && !ss.length) out += '<div class="empty">没有找到，换个词试试</div>';
  box.innerHTML = out;
}

/* ---------- 场景详情 ---------- */
function miniCase(cid){
  const c = CASE[cid]; if(!c) return '';
  return `<div class="card minicase pressable" onclick="openCase('${cid}')">
    <span class="cid ${c[1]==='负面'?'neg':''}">${esc(cid)}</span>
    <span class="ct">${esc(c[3])}</span><span class="arrow">›</span></div>`;
}

function goScen(bid){
  view = {name:'scen', bid};
  const b = B[bid];
  let stepsHtml = '', laterHtml = '', quotesHtml = '', redHtml = '', hfHtml = '', caseHtml = '';

  b.sops.forEach(sid => {
    const s = SOP[sid];
    splitSteps(s[5]).forEach((t,i) => {
      stepsHtml += `<div class="card step fi"><div class="stepnum">${i+1}</div><div><div class="steptx">${esc(t)}</div></div></div>`;
    });
    const later = splitSteps(s[6]).concat(splitSteps(s[7]));
    later.forEach(t => { laterHtml += `<div class="card step"><div class="stepnum">·</div><div><div class="steptx">${esc(t)}</div></div></div>`; });
    if(s[8]) quotesHtml += `<div class="quote">${esc(s[8])}</div>`;
    if(s[9]) redHtml += `<div class="redline">${esc(s[9])}</div>`;
  });
  b.hfs.forEach((id,i) => { hfHtml += hfCard(id, i); });
  b.cases.forEach(cid => { caseHtml += miniCase(cid); });

  const lvl = b.sops.length ? SOP[b.sops[0]][3] : '';

  $app.innerHTML = `
    <button class="backbtn" onclick="goHome()">‹ 返回</button>
    <div class="schead fi">
      <div class="snum">场景 ${b.num}</div>
      <h2>${esc(b.title)}</h2>
      <div class="sub">${esc(b.sub)}</div>
      ${lvl ? `<span class="lvl ${bid==='good'?'calm':''}">${esc(lvl)}</span>` : ''}
    </div>
    ${stepsHtml ? `<div class="slabel">现在就做（现场第一时间）</div>${stepsHtml}` : ''}
    ${laterHtml ? `<div class="phase">稳住之后：核查与收口</div>${laterHtml}` : ''}
    ${quotesHtml ? `<div class="slabel">对外统一口径</div>${quotesHtml}` : ''}
    ${hfHtml ? `<div class="slabel">照着说（点复制，照着念）</div>${hfHtml}` : ''}
    ${redHtml ? `<div class="slabel">升级红线：出现这些情况立刻上报总部</div>${redHtml}` : ''}
    ${caseHtml ? `<div class="slabel">真实案例（看看上次怎么处理的）</div>${caseHtml}` : ''}
    <div style="height:20px"></div>`;
  window.scrollTo(0,0);
  bindCopy();
}

function goHome(){ view={name:'home'}; renderHome(); }

function bindCopy(){
  document.querySelectorAll('.copybtn[data-hf]').forEach(btn => {
    btn.onclick = e => { e.stopPropagation(); copyText(btn, HF[btn.dataset.hf][4]); };
  });
}

/* ---------- 案例库 tab ---------- */
function renderCases(){
  let pills = `<button class="pill ${caseFilter==='all'?'on':''}" data-f="all">全部 ${DATA.cases.length}</button>`;
  DATA.scenOrder.forEach(bid => {
    const n = B[bid].cases.length;
    if(n) pills += `<button class="pill ${caseFilter===bid?'on':''}" data-f="${bid}">${esc(B[bid].title)} ${n}</button>`;
  });
  $app.innerHTML = `
    <div class="searchwrap"><input class="search" id="caseSearch" placeholder="搜案例，比如：蟑螂、1818、东鹏"></div>
    <div class="pills" id="pills">${pills}</div>
    <div id="caseList"></div>`;
  document.querySelectorAll('#pills .pill').forEach(p => {
    p.onclick = () => { caseFilter = p.dataset.f; renderCases(); };
  });
  const inp = document.getElementById('caseSearch');
  inp.addEventListener('input', () => renderCaseList(inp.value.trim()));
  renderCaseList('');
}

function renderCaseList(q){
  let list = DATA.cases;
  if(caseFilter !== 'all') list = list.filter(c => CASE2BUCKET[c[0]] === caseFilter);
  if(q) list = list.filter(c => (c[0]+c[2]+c[3]+c[4]+c[6]).includes(q));
  const box = document.getElementById('caseList');
  if(!list.length){ box.innerHTML = '<div class="empty">没有匹配的案例</div>'; return; }
  box.innerHTML = list.map((c,i) => {
    const badge = c[1]==='正面' ? '<span class="badge pos">正面</span>'
      : (c[0].startsWith('HY') ? '<span class="badge hy">行业镜鉴</span>' : '<span class="badge neg">负面</span>');
    return `<div class="card casecard pressable fi" style="animation-delay:${Math.min(i*40,240)}ms" onclick="openCase('${c[0]}')">
      <div class="crow"><span class="cid ${c[1]==='负面'?'neg':''}">${esc(c[0])}</span>${badge}<span class="cdate">${esc(String(c[4]).slice(0,16))}</span></div>
      <div class="ctitle">${esc(c[3])}</div>
      <div class="cbrief">${esc(String(c[6]).slice(0,64))}…</div>
    </div>`;
  }).join('');
}

/* ---------- 案例详情浮层 ---------- */
function openOverlay(html){
  const ov = document.getElementById('overlay');
  document.getElementById('ovin').innerHTML =
    `<button class="backbtn" onclick="closeOverlay()">‹ 关闭</button>` + html;
  ov.classList.add('show'); ov.scrollTop = 0;
}
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); }

function openCase(cid){
  const c = CASE[cid]; if(!c) return;
  const secs = [
    ['时间', c[4]], ['涉事方', c[5]], ['发生了什么', c[6]], ['传播情况', c[7]],
    ['处置策略', c[8]], ['处置动作', c[9]], ['结果', c[10]],
    ['做对与做错', c[11]], ['经验沉淀（下次照这个来）', c[12]],
  ];
  let body = `<div class="crow"><span class="cid ${c[1]==='负面'?'neg':''}">${esc(c[0])}</span>
    <span class="tagchip">${esc(c[2])}</span></div>
    <div class="ovtitle">${esc(c[3])}</div>`;
  secs.forEach(([t,v]) => {
    if(v) body += `<div class="slabel">${t}</div><div class="card sec"><p>${esc(v)}</p></div>`;
  });
  if(c[13] && SOP[c[13]]) body += `<div class="slabel">对应 SOP</div>
    <div class="card minicase pressable" onclick="openSopOverlay('${c[13]}')"><span class="cid">${esc(c[13])}</span><span class="ct">${esc(SOP[c[13]][1])}</span><span class="arrow">›</span></div>`;
  openOverlay(body);
}

function openSopOverlay(sid){
  const s = SOP[sid]; if(!s) return;
  let body = `<div class="crow"><span class="cid">${esc(s[0])}</span>
    ${s[3]?`<span class="lvl calm">${esc(s[3])}</span>`:''}</div>
    <div class="ovtitle">${esc(s[1])}</div>`;
  body += `<div class="slabel">什么时候用</div><div class="card sec"><p>${esc(s[2])}</p></div>`;
  const phases = [['第一时间（现场）', s[5]], ['核查与跟进', s[6]], ['收口与修复', s[7]]];
  phases.forEach(([t,v]) => {
    const steps = splitSteps(v);
    if(!steps.length) return;
    body += `<div class="slabel">${t}</div>` + steps.map((t2,i) =>
      `<div class="card step"><div class="stepnum">${i+1}</div><div><div class="steptx">${esc(t2)}</div></div></div>`).join('');
  });
  if(s[8]) body += `<div class="slabel">对外统一口径</div><div class="quote">${esc(s[8])}</div>`;
  if(s[9]) body += `<div class="slabel">升级红线</div><div class="redline">${esc(s[9])}</div>`;
  openOverlay(body);
}

function openHfOverlay(hid){
  const h = HF[hid]; if(!h) return;
  openOverlay(`<div class="crow"><span class="cid">${esc(h[0])}</span><span class="tagchip">${esc(h[1])}</span><span class="tagchip">${esc(h[2])}</span></div>
    <div class="ovtitle">${esc(h[3])}</div>
    ${hfCard(hid,0)}
    <div style="height:16px"></div>`);
  bindCopy();
}

/* ---------- 锦囊 tab ---------- */
const HF_GROUPS = [
  ['对顾客、索赔人', ['HF-05','HF-06','HF-07','HF-09','HF-13','HF-14','HF-23','HF-24','HF-29']],
  ['对记者、媒体、网友', ['HF-01','HF-08','HF-12','HF-16','HF-17','HF-18','HF-19','HF-25','HF-26']],
  ['对监管部门', ['HF-02','HF-04']],
  ['对加盟商', ['HF-11','HF-27','HF-28']],
  ['对内部同事', ['HF-03','HF-10','HF-15','HF-20','HF-22','HF-30']],
  ['通用兜底', ['HF-21']],
];
function renderKit(){
  $app.innerHTML = `
    <div class="seg">
      <button class="segbtn ${kitSeg==='hf'?'on':''}" data-s="hf">话术库 ${DATA.hfs.length}</button>
      <button class="segbtn ${kitSeg==='sop'?'on':''}" data-s="sop">SOP ${DATA.sops.length}</button>
    </div>
    <div id="kitBody"></div>`;
  document.querySelectorAll('.segbtn').forEach(b => { b.onclick = () => { kitSeg = b.dataset.s; renderKit(); }; });
  const box = document.getElementById('kitBody');
  if(kitSeg === 'hf'){
    let out = '';
    HF_GROUPS.forEach(([g, ids]) => {
      const cards = ids.map((id,i) => hfCard(id,i)).join('');
      if(cards) out += `<div class="slabel">${g}</div>${cards}`;
    });
    box.innerHTML = out;
    bindCopy();
  } else {
    box.innerHTML = DATA.sops.map((s,i) => `
      <div class="card sopcard fi" style="animation-delay:${Math.min(i*40,240)}ms" data-sop="${s[0]}">
        <div class="sophead pressable">
          <span class="cid">${s[0]}</span>
          <span class="st"><span class="sname">${esc(s[1])}</span><div class="strig">${esc(s[2])}</div></span>
          <span class="chev">›</span>
        </div>
        <div class="sopbody" id="sopb-${s[0]}"></div>
      </div>`).join('');
    document.querySelectorAll('.sopcard').forEach(card => {
      card.querySelector('.sophead').onclick = () => {
        const open = card.classList.toggle('open');
        const body = card.querySelector('.sopbody');
        if(open && !body.innerHTML){
          const s = SOP[card.dataset.sop];
          let h = '';
          if(s[3]) h += `<div class="card sec" style="margin-bottom:10px"><h4>定级</h4><p>${esc(s[3])}　｜　牵头：${esc(s[4])}</p></div>`;
          [['第一时间（现场）',s[5]],['核查与跟进',s[6]],['收口与修复',s[7]]].forEach(([t,v]) => {
            const steps = splitSteps(v);
            if(steps.length) h += `<div class="phase">${t}</div>` + steps.map((t2,i) =>
              `<div class="card step"><div class="stepnum">${i+1}</div><div><div class="steptx">${esc(t2)}</div></div></div>`).join('');
          });
          if(s[8]) h += `<div class="phase">对外统一口径</div><div class="quote">${esc(s[8])}</div>`;
          if(s[9]) h += `<div class="phase">升级红线</div><div class="redline">${esc(s[9])}</div>`;
          if(s[10]) h += `<div class="phase">相关案例</div>` + relatedCases(s[10]);
          body.innerHTML = h;
        }
      };
    });
  }
}
function relatedCases(txt){
  let out = '';
  (txt.match(/(MYJ|HY)-[FZ]\d+/g) || []).forEach(cid => { if(CASE[cid]) out += miniCase(cid); });
  return out;
}

/* ---------- tab 切换 ---------- */
document.querySelectorAll('.tabbtn').forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tabbtn').forEach(x => x.classList.toggle('on', x===b));
    if(tab==='home'){ view={name:'home'}; renderHome(); }
    else if(tab==='cases'){ renderCases(); }
    else renderKit();
    window.scrollTo(0,0);
  };
});

renderHome();
